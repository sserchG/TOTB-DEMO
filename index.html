cable de cada uno.", "why": "Un punto de acceso conectado directamente a la red de control deja que cualquiera con la contraseña, o sin ella, llegue a los equipos de proceso.", "fix": "Nada inalámbrico en la red de control sin un análisis previo; si hace falta, en su propia zona y detrás de un firewall.", "add": [{"id": "ap2", "kind": "ap", "x": 13, "y": 12.2, "z": 2.4, "label": "Punto de acceso de los muelles"}], "cables": [["ap2", "plc", 12.6]]}, {"id": "R259", "type": "iso", "tag": "Instalación", "level": "medio", "lives": 3, "scene": "almacen", "q": "Una cámara de la nave está cableada al armario de control en lugar de a la red de vídeo. Tócala.", "correct": "cam2", "answer": "La cámara de la nave", "hint": "La de la oficina va al rack.", "why": "Una cámara en la red de control mezcla un dispositivo IoT, a menudo vulnerable, con los equipos de proceso.", "fix": "Red de videovigilancia propia, que solo hable con el grabador.", "add": [{"id": "cam2", "kind": "cam", "x": 19.3, "y": 0.1, "z": 1.25, "label": "Cámara de la nave"}], "cables": [["cam2", "plc", 0.9]]}, {"id": "R260", "type": "iso", "tag": "Instalación", "level": "dificil", "lives": 3, "scene": "almacen", "q": "Un proveedor ha metido su propia línea de internet en la nave. ¿Dónde está?", "correct": "op2", "answer": "El segundo router", "hint": "Hay dos routers de operador.", "why": "Una línea de internet de un tercero conectada al control de las cintas es una entrada que no pasa por ningún firewall.", "fix": "Inventario de líneas contratadas y prohibición de líneas de terceros.", "add": [{"id": "op2", "kind": "op", "x": 11, "y": -0.3, "z": 1.4, "label": "Router de otro operador"}], "cables": [["op2", "plc", 2.0]]}, {"id": "R261", "type": "text", "tag": "Fundamentos", "level": "facil", "q": "Tu equipo conoce la IP del servidor, pero para enviar la trama necesita su MAC. ¿Qué protocolo se la pregunta a la red?", "answer": "ARP", "accept": ["arp"], "hint": "Traduce de IP a MAC.", "why": "ARP pregunta por broadcast «¿quién tiene esta IP?» y el dueño responde con su MAC.", "fix": "ARP no verifica las respuestas: Dynamic ARP Inspection evita que alguien suplante al gateway."}, {"id": "R262", "type": "text", "tag": "Fundamentos", "level": "facil", "q": "Un paquete se queda dando vueltas entre dos routers mal configurados, pero no para siempre. ¿Qué campo de la cabecera IP lo elimina al llegar a cero?", "answer": "TTL", "accept": ["ttl", "time to live", "tiempo de vida", "hop limit"], "hint": "Cada router le resta uno.", "why": "El TTL baja en cada salto; al llegar a cero el router descarta el paquete y avisa con ICMP time exceeded.", "fix": "El TTL también delata el sistema operativo y los saltos: útil para inventario pasivo."}, {"id": "R263", "type": "text", "tag": "Diagnóstico", "level": "dificil", "q": "Envías un paquete de 1600 bytes con el bit «no fragmentar» por un enlace con MTU 1500. ¿Qué mensaje ICMP te devuelven?", "answer": "Fragmentation needed (fragmentación necesaria)", "accept": ["fragmentation needed", "fragmentacion necesaria", "packet too big"], "keys": ["fragmentation", "fragmentacion", "too big"], "hint": "El router no puede partirlo.", "why": "Si el paquete no cabe y no se puede fragmentar, el router lo descarta y devuelve ICMP «fragmentation needed» con la MTU que sí cabe.", "fix": "No bloquees ese mensaje: sin él, el descubrimiento de MTU falla y las conexiones se cuelgan."}, {"id": "R264", "type": "text", "tag": "Protocolos", "level": "medio", "q": "Un servidor escucha en el puerto 993. ¿Qué protocolo de correo cifrado es?", "answer": "IMAPS (IMAP sobre TLS)", "accept": ["imaps", "imap", "imap tls", "imap ssl"], "keys": ["imap"], "hint": "Es para leer el correo, no para enviarlo.", "why": "El 993 es IMAP sobre TLS, para leer el correo con la conexión cifrada.", "fix": "Desactiva IMAP sin cifrar (143) y exige MFA en el acceso al correo."}, {"id": "R265", "type": "text", "tag": "Enrutamiento", "level": "medio", "q": "En la tabla de rutas están 10.0.0.0/8 y 10.1.2.0/24. ¿Cuál se usa para llegar a 10.1.2.7?", "answer": "10.1.2.0/24", "accept": ["10.1.2.0/24", "/24", "la /24"], "hint": "La ruta más concreta gana.", "why": "El router elige siempre el prefijo más largo que coincide: la /24 es más específica que la /8.", "fix": "Una ruta más específica mal puesta puede desviar tráfico: revisa las rutas estáticas."}, {"id": "R266", "type": "text", "tag": "Ataques", "level": "medio", "q": "Un atacante envía miles de SYN y nunca completa la conexión, llenando la tabla del servidor. ¿Cómo se llama el ataque?", "answer": "SYN flood", "accept": ["syn flood", "inundacion syn"], "keys": ["syn flood", "synflood", "inundacion syn", "inundacion de syn"], "hint": "Inundación de un tipo de paquete.", "why": "Cada SYN reserva recursos esperando el ACK final, que nunca llega, hasta agotar la tabla de conexiones.", "fix": "SYN cookies en el servidor y protección anti-DDoS en el perímetro."}, {"id": "R267", "type": "text", "tag": "NAT", "level": "medio", "q": "Muchos equipos con IP privada salen a internet con una sola IP pública, distinguiéndose por el puerto. ¿Cómo se llama esta técnica?", "answer": "PAT (NAT con sobrecarga)", "accept": ["pat", "nat overload", "masquerade", "masquerading", "nat con sobrecarga"], "keys": ["overload", "sobrecarga", "masquerad"], "hint": "Es NAT, pero jugando con puertos.", "why": "PAT traduce también el puerto de origen, así una sola IP pública sirve a muchos equipos internos.", "fix": "Registra las traducciones: sin ellas no sabrás qué equipo hizo una conexión."}, {"id": "R268", "type": "text", "tag": "Protocolos", "level": "facil", "q": "¿Qué protocolo de monitorización usa el puerto UDP 161?", "answer": "SNMP", "accept": ["snmp"], "hint": "Sirve para consultar el estado de switches y routers.", "why": "SNMP consulta y configura equipos de red por el 161; las alertas (traps) van al 162.", "fix": "Usa SNMPv3 con autenticación y cifrado, y nunca la comunidad «public»."}, {"id": "R269", "type": "text", "tag": "OT", "level": "dificil", "q": "En las subestaciones es habitual ver tráfico en el puerto TCP 2404. ¿Qué protocolo de telecontrol es?", "answer": "IEC 60870-5-104", "accept": ["iec 104", "iec 60870-5-104", "iec104", "104"], "keys": ["60870", "iec 104", "iec104"], "hint": "Es una norma IEC con un número terminado en 104.", "why": "IEC 104 es el protocolo de telecontrol habitual en el sector eléctrico europeo y usa el puerto 2404.", "fix": "Filtra el 2404 por origen y vigila órdenes de mando fuera de lo habitual."}, {"id": "R270", "type": "text", "tag": "OT", "level": "medio", "q": "¿Cuál es el puerto por defecto de OPC UA?", "answer": "4840", "accept": ["4840"], "hint": "Empieza por 48.", "why": "OPC UA usa por defecto el puerto 4840.", "fix": "OPC UA admite cifrado y autenticación: actívalos, porque muchos despliegues los dejan en modo None."}, {"id": "R271", "type": "text", "tag": "Principios", "level": "facil", "q": "Cada usuario y cada servicio debe tener solo los permisos imprescindibles para su trabajo. ¿Cómo se llama este principio?", "answer": "Mínimo privilegio", "accept": ["minimo privilegio", "privilegio minimo", "least privilege"], "keys": ["minimo privilegio", "menor privilegio", "least privilege", "privilegio minimo"], "hint": "Lo menos posible.", "why": "Con el mínimo privilegio, una cuenta robada solo da acceso a lo poco que esa cuenta necesitaba.", "fix": "Revisa periódicamente permisos y grupos privilegiados."}, {"id": "R272", "type": "text", "tag": "Principios", "level": "facil", "q": "Pones varias capas de seguridad para que, si una falla, haya otra detrás. ¿Cómo se llama esta estrategia?", "answer": "Defensa en profundidad", "accept": ["defensa en profundidad", "defense in depth"], "keys": ["profundidad", "in depth"], "hint": "Como las murallas de un castillo.", "why": "Ninguna medida es perfecta: con varias capas, un fallo no basta para llegar al objetivo.", "fix": "Combina medidas de distinto tipo: red, equipo, identidad y detección."}, {"id": "R273", "type": "text", "tag": "Principios", "level": "medio", "q": "Un modelo no confía en nadie por estar dentro de la red y verifica cada acceso, siempre. ¿Cómo se llama?", "answer": "Zero Trust (confianza cero)", "accept": ["zero trust", "confianza cero"], "keys": ["zero trust", "confianza cero", "zerotrust"], "hint": "Confianza: cero.", "why": "Zero Trust parte de que la red interna también puede estar comprometida y verifica identidad, equipo y contexto en cada acceso.", "fix": "Empieza por lo crítico: accesos de administración y remotos."}, {"id": "R274", "type": "text", "tag": "Ingeniería social", "level": "facil", "q": "Te llaman por teléfono haciéndose pasar por soporte para sacarte la contraseña. ¿Cómo se llama este fraude?", "answer": "Vishing", "accept": ["vishing"], "hint": "Phishing, pero por voz.", "why": "El vishing es phishing por voz: suplantan a soporte, al banco o a un directivo para que reveles datos.", "fix": "Soporte nunca debe pedir contraseñas; ante la duda, cuelga y llama tú al número oficial."}, {"id": "R275", "type": "text", "tag": "Ingeniería social", "level": "facil", "q": "Y si el engaño llega por SMS, con un enlace a un paquete retenido, ¿cómo se llama?", "answer": "Smishing", "accept": ["smishing"], "hint": "Phishing por SMS.", "why": "El smishing es phishing por SMS, a menudo con enlaces acortados que esconden el destino.", "fix": "No pulses enlaces de SMS inesperados: entra tú en la web oficial."}, {"id": "R276", "type": "text", "tag": "Web", "level": "medio", "q": "Un firewall que entiende HTTP y bloquea inyecciones SQL antes de que lleguen a la web. ¿Qué tipo de firewall es?", "answer": "WAF", "accept": ["waf", "web application firewall", "firewall de aplicaciones web"], "keys": ["waf", "aplicaciones web", "web application"], "hint": "Firewall de aplicaciones web.", "why": "Un WAF analiza las peticiones HTTP y bloquea patrones de ataque como inyecciones o XSS.", "fix": "Un WAF ayuda, pero no sustituye a programar bien: consultas parametrizadas siempre."}, {"id": "R277", "type": "text", "tag": "Detección", "level": "facil", "q": "Un sistema analiza el tráfico y, además de avisar, bloquea los ataques en el momento. ¿Cómo se llama?", "answer": "IPS", "accept": ["ips", "sistema de prevencion de intrusiones", "intrusion prevention"], "keys": ["prevencion de intrusion", "intrusion prevention"], "hint": "Un IDS que también actúa.", "why": "El IDS detecta y avisa; el IPS está en línea con el tráfico y puede bloquearlo.", "fix": "En OT, empieza en modo detección: un bloqueo erróneo puede parar el proceso."}, {"id": "R278", "type": "text", "tag": "FortiGate", "level": "medio", "q": "En FortiGate, ¿cómo se llama el objeto que publica un servidor interno en una IP pública?", "answer": "VIP (IP virtual)", "accept": ["vip", "ip virtual", "virtual ip"], "keys": ["virtual ip", "ip virtual"], "hint": "Tres letras, como un invitado especial.", "why": "Una VIP hace NAT de destino: traduce la IP pública a la interna del servidor.", "fix": "Publica solo el puerto necesario y acompaña la política de IPS y registro."}, {"id": "R279", "type": "text", "tag": "Herramientas", "level": "facil", "q": "¿Cuál es la herramienta gráfica más usada para capturar y analizar paquetes?", "answer": "Wireshark", "accept": ["wireshark"], "hint": "Su icono es una aleta de tiburón.", "why": "Wireshark captura el tráfico y decodifica cientos de protocolos, también industriales como Modbus o S7.", "fix": "Capturar tráfico ajeno sin autorización es ilegal: hazlo solo en tus redes."}, {"id": "R280", "type": "text", "tag": "Herramientas", "level": "medio", "q": "¿Qué extensión tienen los ficheros de captura de tráfico de Wireshark y tcpdump?", "answer": "pcap (o pcapng)", "accept": ["pcap", "pcapng", ".pcap"], "keys": ["pcap"], "hint": "Packet capture.", "why": "Las capturas se guardan en formato pcap o pcapng, que leen casi todas las herramientas.", "fix": "Guarda las capturas de incidentes con su hash, como cualquier otra evidencia."}, {"id": "R281", "type": "text", "tag": "Criptografía", "level": "medio", "q": "Un hash no se puede revertir, pero se puede comparar con millones de hashes precalculados. ¿Cómo se llaman esas tablas?", "answer": "Tablas arcoíris", "accept": ["tablas arcoiris", "rainbow tables", "tablas rainbow"], "keys": ["arcoiris", "rainbow", "arco iris"], "hint": "Tienen nombre de fenómeno atmosférico.", "why": "Las tablas arcoíris guardan hashes precalculados para recuperar contraseñas sin calcularlas una a una.", "fix": "Usa algoritmos lentos con sal, como bcrypt o Argon2."}, {"id": "R282", "type": "text", "tag": "Criptografía", "level": "medio", "q": "¿Qué se añade a cada contraseña antes de calcular su hash para que las tablas arcoíris no sirvan?", "answer": "Sal (salt)", "accept": ["sal", "salt"], "hint": "Como en la cocina.", "why": "La sal es un valor aleatorio distinto por usuario: dos contraseñas iguales dan hashes distintos y las tablas precalculadas no sirven.", "fix": "Sal única por usuario y un algoritmo lento de hash."}, {"id": "R283", "type": "text", "tag": "Criptografía", "level": "facil", "q": "Si se usa la misma clave para cifrar y para descifrar, ¿qué tipo de cifrado es?", "answer": "Simétrico", "accept": ["simetrico", "cifrado simetrico", "symmetric"], "hint": "Las dos partes comparten lo mismo.", "why": "El cifrado simétrico usa una sola clave compartida, como AES; el asimétrico usa un par de claves pública y privada.", "fix": "El reto del simétrico es repartir la clave de forma segura: para eso se usa el asimétrico."}, {"id": "R284", "type": "text", "tag": "Logs", "level": "facil", "q": "¿Qué puerto usa tradicionalmente syslog para enviar logs?", "answer": "514", "accept": ["514"], "hint": "Empieza por 5.", "why": "Syslog usa el puerto 514, normalmente sobre UDP.", "fix": "Si los logs viajan por redes no confiables, usa syslog sobre TLS (puerto 6514)."}, {"id": "R285", "type": "text", "tag": "Monitorización", "level": "medio", "q": "El switch envía una copia de todo el tráfico de varios puertos a uno solo para analizarlo. ¿Cómo se llama esa función?", "answer": "Puerto espejo (SPAN)", "accept": ["span", "port mirroring", "puerto espejo", "mirror"], "keys": ["span", "mirror", "espejo"], "hint": "Como un espejo.", "why": "Un puerto SPAN o espejo copia el tráfico hacia un analizador sin interferir en la comunicación.", "fix": "Es la base de la monitorización pasiva en OT."}, {"id": "R286", "type": "text", "tag": "IEC 62443", "level": "dificil", "q": "IEC 62443 define niveles de seguridad (SL) según la capacidad del atacante. Sin contar el 0, ¿cuántos hay?", "answer": "4", "accept": ["4", "cuatro"], "hint": "Del atacante casual al estatal.", "why": "SL 1 protege frente a errores y ataques casuales, y SL 4 frente a atacantes con muchos recursos.", "fix": "Define el nivel objetivo de cada zona según su riesgo, no el máximo para todo."}, {"id": "R287", "type": "text", "tag": "Purdue", "level": "medio", "q": "En el modelo Purdue, ¿cómo se llama la zona intermedia entre la red de planta (nivel 3) y la corporativa (nivel 4)?", "answer": "DMZ industrial", "accept": ["dmz industrial", "dmz", "nivel 3.5", "3.5"], "keys": ["dmz", "3.5", "3,5"], "hint": "Está entre los niveles 3 y 4.", "why": "La DMZ industrial, o nivel 3.5, aloja lo que comparten IT y OT para que ninguna conexión cruce directamente.", "fix": "Ningún tráfico debería atravesar la DMZ de un lado a otro sin terminar en ella."}, {"id": "R288", "type": "text", "tag": "OT", "level": "facil", "q": "SCADA son unas siglas en inglés. ¿Qué palabra empieza por S?", "answer": "Supervisory (supervisión)", "accept": ["supervisory", "supervision", "supervisor"], "keys": ["supervis"], "hint": "Supervisa, no controla directamente.", "why": "SCADA es Supervisory Control And Data Acquisition: supervisión, control y adquisición de datos.", "fix": "El SCADA es un objetivo de alto valor: mantenlo actualizado y con accesos mínimos."}, {"id": "R289", "type": "text", "tag": "Active Directory", "level": "dificil", "q": "El atacante captura una autenticación NTLM y la reenvía a otro servidor para entrar como la víctima, sin descifrarla. ¿Cómo se llama?", "answer": "NTLM relay", "accept": ["ntlm relay", "relay", "relay ntlm"], "keys": ["relay", "reenvio"], "hint": "Es un reenvío.", "why": "En un relay, el atacante se pone en medio y reutiliza la autenticación de la víctima contra otro servicio.", "fix": "Firma SMB obligatoria, protección extendida en servicios web y desactivar NTLM donde se pueda."}, {"id": "R290", "type": "text", "tag": "Herramientas", "level": "medio", "q": "¿Qué herramienta famosa extrae contraseñas y hashes de la memoria de Windows?", "answer": "Mimikatz", "accept": ["mimikatz"], "hint": "Tiene nombre de gato.", "why": "Mimikatz lee credenciales de la memoria del proceso de autenticación de Windows.", "fix": "Credential Guard, protección de LSASS y que los administradores no inicien sesión en equipos de usuario."}, {"id": "R291", "type": "text", "tag": "Windows", "level": "dificil", "q": "¿Qué proceso de Windows guarda las credenciales en memoria y es el objetivo favorito de Mimikatz?", "answer": "LSASS", "accept": ["lsass", "lsass.exe"], "hint": "Local Security Authority.", "why": "LSASS gestiona la autenticación y mantiene en memoria material de credenciales.", "fix": "Activa la protección de LSASS (RunAsPPL) y Credential Guard, y alerta ante accesos a su memoria."}, {"id": "R292", "type": "text", "tag": "Switching", "level": "facil", "q": "¿Qué estándar del IEEE define las etiquetas de VLAN en las tramas?", "answer": "802.1Q", "accept": ["802.1q", "8021q", "dot1q"], "hint": "Empieza por 802.1.", "why": "802.1Q añade a la trama una etiqueta de 4 bytes con el ID de VLAN.", "fix": "Etiqueta también la VLAN nativa en los troncales para evitar saltos de VLAN."}, {"id": "R293", "type": "text", "tag": "Identidad", "level": "medio", "q": "¿Qué estándar autentica a un equipo con usuario o certificado antes de dejarle usar un puerto de red?", "answer": "802.1X", "accept": ["802.1x", "8021x", "dot1x"], "hint": "Se parece al de las VLAN, pero con X.", "why": "802.1X bloquea el puerto hasta que el equipo se autentica contra un servidor RADIUS.", "fix": "Úsalo en cable y Wi-Fi, con certificados para los equipos corporativos."}, {"id": "R294", "type": "text", "tag": "DNS", "level": "medio", "q": "El atacante consigue que el resolver de tu empresa guarde una respuesta falsa para un dominio. ¿Cómo se llama el ataque?", "answer": "Envenenamiento de caché DNS", "accept": ["envenenamiento de cache dns", "dns cache poisoning", "envenenamiento dns", "dns spoofing"], "keys": ["envenenamiento", "poisoning", "dns spoofing", "spoofing dns"], "hint": "La caché queda contaminada.", "why": "Con la caché envenenada, todos los usuarios que pregunten por ese dominio van a la IP del atacante.", "fix": "DNSSEC, resolvers actualizados y puertos de origen aleatorios."}, {"id": "R295", "type": "text", "tag": "DNS", "level": "facil", "q": "¿Qué tipo de registro DNS asocia un nombre a una dirección IPv6?", "answer": "AAAA", "accept": ["aaaa"], "hint": "Es el de IPv4, pero cuatro veces.", "why": "El registro A apunta a IPv4 y el AAAA a IPv6.", "fix": "Si tienes IPv6 activo, revisa que tus registros y firewalls lo contemplen."}, {"id": "R296", "type": "text", "tag": "Phishing", "level": "facil", "q": "Te llega un adjunto llamado factura.pdf.exe. ¿Qué tipo de fichero es en realidad?", "answer": "Un ejecutable (.exe)", "accept": ["exe", "ejecutable", ".exe"], "keys": ["exe", "ejecutable"], "hint": "Lo que cuenta es lo último.", "why": "Solo la última extensión decide el tipo: es un programa disfrazado de PDF.", "fix": "Muestra siempre las extensiones en Windows y bloquea ejecutables en el correo."}, {"id": "R297", "type": "text", "tag": "Malware", "level": "facil", "q": "Un malware se propaga solo por la red, de equipo en equipo, sin que nadie haga nada. ¿Cómo se llama ese tipo?", "answer": "Gusano", "accept": ["gusano", "worm"], "hint": "Se arrastra solo.", "why": "El gusano se replica aprovechando vulnerabilidades de red, sin intervención del usuario, como WannaCry.", "fix": "Parchea los servicios expuestos y segmenta para frenar la propagación."}, {"id": "R298", "type": "text", "tag": "OT", "level": "medio", "q": "Stuxnet manipulaba PLC para dañar centrifugadoras. ¿De qué fabricante eran esos PLC?", "answer": "Siemens", "accept": ["siemens"], "hint": "El mismo del protocolo S7.", "why": "Stuxnet atacaba PLC Siemens S7-300 a través del software de ingeniería Step 7.", "fix": "Controla qué estaciones pueden programar los PLC y monitoriza cambios de programa."}, {"id": "R299", "type": "text", "tag": "OT", "level": "dificil", "q": "En 2016 un malware dejó sin luz parte de Kiev hablando directamente protocolos de subestación. ¿Cómo se llamó?", "answer": "Industroyer (CrashOverride)", "accept": ["industroyer", "crashoverride", "crash override"], "keys": ["industroyer", "crashoverride", "crash override"], "hint": "Su nombre mezcla industria y destruir.", "why": "Industroyer enviaba órdenes legítimas de protocolos como IEC 104 para abrir interruptores.", "fix": "Monitoriza órdenes de mando inusuales: el protocolo es legítimo, el uso no."}, {"id": "R300", "type": "text", "tag": "OT", "level": "dificil", "q": "Un malware de 2017 atacó los sistemas instrumentados de seguridad (SIS) Triconex de una planta petroquímica. ¿Cómo se llama?", "answer": "Triton (Trisis)", "accept": ["triton", "trisis", "hatman"], "hint": "Comparte nombre con un dios del mar.", "why": "Triton intentó reprogramar los controladores de seguridad, los que evitan explosiones y fugas.", "fix": "Los SIS, aislados y con la llave física en modo RUN, nunca en PROGRAM."}];

function mk(){
  const a = Math.random() * Math.PI * 2, sp = .08 + Math.random() * .22;
  const bx = Math.cos(a) * sp, by = Math.sin(a) * sp;
  return {x:Math.random()*W, y:Math.random()*H, bx, by, vx:bx, vy:by, r:.5 + Math.random()*1.5, a:.25 + Math.random()*.6, tw:Math.random()*6.28};
}
// En el móvil la altura cambia con el teclado y la barra del navegador:
// el lienzo solo se rehace si cambia el ancho (giro) o si crece la altura, y nunca se quitan partículas.
function resize(){
  const nw = innerWidth, nh = Math.max(innerHeight, document.documentElement.clientHeight);
  const turned = Math.abs(nw - W) > 40;
  if (W && !turned && nh <= H) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), ow = W || nw, oh = H || nh;
  W = nw; H = turned ? nh : Math.max(H, nh);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";

function labTerm2(host){
    const HN = P.host || "dmz-web", US = P.user || "analista", HM = "/home/" + US;
    // Terminal SSH simulado: sistema de ficheros, cd, historial con flechas, Tab y Ctrl+L
    const FS = P.dirs, FILES = P.files, OUT = P.out;

    const ps1 = () => { const p = mk2("span", "ps1"); p.append(mk2("b", null, US + "@" + HN), ":", mk2("span", "path", home(cwd)), "$ "); return p; };

    const pr = ps1(); live.append(pr, typed, cur_, ci); out.appendChild(live);
    const sync = () => { typed.textContent = ci.value; ttl.textContent = US + "@" + HN + ": " + home(cwd); live.replaceChild(ps1(), live.firstChild); out.scrollTop = out.scrollHeight; };
    ["Linux " + HN + " 5.15.0-91-generic x86_64", "", "Last login: Tue Nov 17 08:59:12 2026 from " + (P.from || "10.20.0.40"), "Escribe help si necesitas ayuda."].forEach(l => line(l, "dim"));
    sync();
    const resolve = p => { if (!p || p === "~") return HM; let parts = (p.startsWith("/") ? [] : cwd.split("/").filter(Boolean)); if (p.startsWith("~/")){ parts = ["home", US]; p = p.slice(2); }
      for (const seg of p.split("/").filter(Boolean)){ if (seg === "..") parts.pop(); else if (seg !== ".") parts.push(seg); } return "/" + parts.join("/"); };
    const isDir = p => FS[p] !== undefined, isFile = p => p in FILES;
    const run = raw => {

      const [cmd, ...args] = c.split(/\s+/), flags = args.filter(a => a.startsWith("-")).join(""), pos = args.filter(a => !a.startsWith("-"));
      const sudo = cmd === "sudo";
      if (sudo){ line("[sudo] contraseña para " + US + ": "); line(US + " no está en el archivo sudoers. Este incidente será reportado.", "dim"); return; }
      switch (cmd){

        case "clear": [...out.querySelectorAll(".t-l")].forEach(n => n.remove()); break;
        case "pwd": line(cwd); break;
        case "whoami": line(US); break;
        case "hostname": line(HN); break;
        case "uname": line(flags.includes("a") ? "Linux " + HN + " 5.15.0-91-generic #101-Ubuntu SMP x86_64 GNU/Linux" : "Linux"); break;
        case "id": line("uid=1000(" + US + ") gid=1000(" + US + ") grupos=1000(" + US + "),4(adm)"); break;
        case "cd": { const p = resolve(pos[0]); if (isDir(p)) cwd = p; else line("bash: cd: " + pos[0] + ": No existe el archivo o el directorio"); break; }
        case "ls": case "ll": { const p = resolve(pos[0] || "."); if (!isDir(p)){ line(isFile(p) ? pos[0] : "ls: no se puede acceder a '" + pos[0] + "': No existe el archivo o el directorio"); break; }
          const all = flags.includes("a") || cmd === "ll", ent = FS[p].filter(e => all || !e.startsWith("."));
          if (flags.includes("l") || cmd === "ll") line(ent.map(e => (e.endsWith("/") ? "drwxr-xr-x" : (FILES[(p === "/" ? "" : p) + "/" + e] === null ? "-rwxr-xr-x" : "-rw-r--r--")) + "  " + (p.indexOf(HM) === 0 ? US : (P.owners && Object.keys(P.owners).find(k => p.indexOf(k) === 0) ? P.owners[Object.keys(P.owners).find(k => p.indexOf(k) === 0)] : "root")).padEnd(9) + (e.endsWith("/") ? "4096" : FILES[(p === "/" ? "" : p) + "/" + e] === null ? "842512" : "1204").padStart(7) + "  nov 17 02:15  " + e).join("\n"));
          else line(ent.join("  ")); break; }
        case "cat": case "less": case "more": case "head": case "tail": { if (!pos[0]){ line(cmd + ": falta un operando"); break; } const p = resolve(pos[0]);
          if (isDir(p)) line(cmd + ": " + pos[0] + ": Es un directorio"); else if (!isFile(p)) line(cmd + ": " + pos[0] + ": No existe el archivo o el directorio"); else if (FILES[p] === null) line("ELF\u0002\u0001\u0001 >\u0001 @ ... (binario ilegible)", "dim"); else line(FILES[p]); break; }
        case "file": { const p = resolve(pos[0]); line(!isFile(p) ? pos[0] + ": no existe" : FILES[p] === null ? pos[0] + ": ELF 64-bit LSB executable, x86-64, stripped" : pos[0] + ": ASCII text"); break; }
        case "strings": { const p = resolve(pos[0]); line(FILES[p] === null ? ((P.strings || {})[p] || "GLIBC_2.34\n/lib64/ld-linux-x86-64.so.2") : (FILES[p] || "")); break; }
        case "grep": { const pat = pos[0], p = resolve(pos[1] || ""); if (!pat || !isFile(p) || FILES[p] === null){ line("uso: grep PATRÓN FICHERO"); break; } const r = FILES[p].split("\n").filter(l => l.toLowerCase().includes(pat.toLowerCase())); if (r.length) line(r.join("\n")); break; }
        case "ps": line(/a|u|x|e/.test(flags + pos.join("")) ? OUT.psaux : OUT.ps); break;
        case "netstat": case "ss": line(OUT.net); break;
        case "crontab": { const ui = args.indexOf("-u"), who = ui >= 0 ? args[ui + 1] : US, k = who === US ? "cron" : "cron_" + who; line(OUT[k] || (who === "www-data" && OUT.cronw) || "no hay crontab para " + who); break; }
        case "history": line(hist.map((h, n) => String(n + 1).padStart(5) + "  " + h).join("\n")); break;
        case "exit": case "logout": line("Esto es un laboratorio: no hay a dónde ir hasta resolverlo.", "dim"); break;
        case "rm": case "kill": case "chmod": case "mv": line("bash: " + cmd + ": operación no permitida en este laboratorio", "dim"); break;
        default: line("bash: " + cmd + ": orden no encontrada");
      }
    };
    const NAMES = ["help","clear","pwd","whoami","hostname","uname","cd","ls","cat","grep","file","strings","ps","netstat","ss","crontab","history","id"];
    ci.addEventListener("input", sync);
    ci.addEventListener("keydown", e => {
      if (e.key === "ArrowUp"){ e.preventDefault(); if (hi > 0){ hi--; ci.value = hist[hi]; sync(); } }
      else if (e.key === "ArrowDown"){ e.preventDefault(); if (hi < hist.length){ hi++; ci.value = hist[hi] || ""; sync(); } }
      else if (e.key === "l" && e.ctrlKey){ e.preventDefault(); run("clear"); sync(); }
      else if (e.key === "Tab"){ e.preventDefault(); const parts = ci.value.split(" "), last = parts.pop();
        let opts;
        if (!parts.length) opts = NAMES.filter(n => n.startsWith(last));
        else { const slash = last.lastIndexOf("/"), base = last.slice(0, slash + 1), pre = last.slice(slash + 1), dir = resolve(base || "."); opts = (FS[dir] || []).filter(e => e.startsWith(pre)).map(e => base + e); }
        if (opts.length === 1){ parts.push(opts[0] + (opts[0].endsWith("/") ? "" : " ")); ci.value = parts.join(" "); sync(); }
        else if (opts.length > 1){ const ln = mk2("div", "t-l"); ln.append(ps1(), ci.value); out.insertBefore(ln, live); line(opts.map(o => o.split("/").filter(Boolean).pop() || o).join("  ")); sync(); } }
    });
    live.onsubmit = e => { e.preventDefault(); const v = ci.value; const ln = mk2("div", "t-l"); ln.append(ps1(), v); out.insertBefore(ln, live); if (v.trim()){ hist.push(v.trim()); } hi = hist.length; ci.value = ""; run(v); sync(); };
    t.addEventListener("click", () => { if (!ci.disabled && !getSelection().toString()) ci.focus({preventScroll:true}); });
    const f = mk2("form", "prompt"), inp = mk2("input", "inp"); inp.id = "inp-term"; inp.placeholder = P.ph || "Tu respuesta"; inp.autocomplete = "off"; inp.spellcheck = false; inp.setAttribute("aria-label", "Tu respuesta");
    const r = mk2("button", "run"); r.type = "submit"; r.appendChild(mk2("span", null, "Comprobar")); f.append(inp, r); host.appendChild(f);
    f.onsubmit = async e => { e.preventDefault(); const g = inp.value.trim(); if (!g || busy || today.status !== "playing") return; if (today.guesses.some(x => x.g === normT(g))){ sayEl.textContent = "Esa ya la has probado."; return; } inp.value = ""; await attempt(P.accept.some(x => normT(x) === normT(g)), normT(g), g); };
    host.appendChild(mk2("p", "lab-note", "Investigar no gasta intentos. Prueba ↑ para el historial y Tab para autocompletar."));
    return {reveal(){ inp.disabled = true; ci.disabled = true; line("Connection to " + HN + " closed.", "dim"); }};
}

function labMap(host){
  const D = P.diagram;
  let svg = '<svg class="map" viewBox="0 0 ' + D.w + ' ' + D.h + '" role="group" aria-label="Diagrama de red">';
  D.links.forEach(d => { svg += '<path class="lk" d="' + d + '"/>'; });
  D.nodes.forEach(n => {
    svg += '<g class="nd" data-id="' + n.id + '" tabindex="0" role="button" aria-label="' + n.label.join(" ") + '"><rect x="' + (n.x - n.w / 2) + '" y="' + (n.y - n.h / 2) + '" width="' + n.w + '" height="' + n.h + '"/>';
    n.label.forEach((t, i) => { svg += '<text x="' + n.x + '" y="' + (n.y + (i - (n.label.length - 1) / 2) * 13 + 4) + '">' + t + '</text>'; });
    svg += '</g>';
  });
  svg += '</svg>';
  const w = mk2("div", "mapw"); w.innerHTML = svg; host.appendChild(w);
  const used = usedKeys(); let sel = null;
  w.querySelectorAll(".nd").forEach(g => {
    if (used.has(g.dataset.id)) g.classList.add("no");
    const pick = () => { if (today.status !== "playing" || g.classList.contains("no")) return; w.querySelectorAll(".nd").forEach(x => x.classList.remove("sel")); g.classList.add("sel"); sel = g; };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } });
  });
  const act = actBtn("Comprobar", async () => {
    if (busy || today.status !== "playing") return;
    if (!sel){ sayEl.textContent = "Toca un elemento del diagrama primero."; return; }
    const g = sel, ok = g.dataset.id === P.correct;
    await attempt(ok, g.dataset.id, null);
    if (!ok){ g.classList.remove("sel"); g.classList.add("no"); sel = null; }
  });
  host.appendChild(act);
  return {reveal(){ w.classList.add("done"); w.querySelectorAll(".nd").forEach(x => x.classList.remove("sel", "no")); w.querySelector('[data-id="' + P.correct + '"]').classList.add("yes"); act.remove(); }};
}

function labTerm(host){
  const t = mk2("div", "term"), out = mk2("div", "t-out"), row = mk2("form", "t-in"), inp = mk2("input");
  inp.type = "text"; inp.autocapitalize = "off"; inp.spellcheck = false; inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocorrect", "off"); inp.setAttribute("aria-label", "Comando");
  row.append(mk2("span", "t-ps", P.prompt), inp); t.append(out, row); host.appendChild(t);
  const print = (str, cls) => { str.split("\n").forEach(l => out.appendChild(mk2("div", "t-l" + (cls ? " " + cls : ""), l))); out.scrollTop = out.scrollHeight; };
  print(P.motd, "dim");
  row.addEventListener("submit", async e => {
    e.preventDefault();
    const c = inp.value.trim().replace(/\s+/g, " "); inp.value = "";
    if (!c) return;
    print(P.prompt + " " + c, "cmd");
    if (c === "clear"){ out.textContent = ""; return; }
    const m = c.match(/^respuesta (.+)$/i);
    if (m){
      if (today.status !== "playing"){ print("El reto ya ha terminado.", "dim"); return; }
      const a = m[1].trim();
      if (today.guesses.some(g => norm(g.g) === norm(a))){ print("Esa ya la has probado.", "dim"); return; }
      const ok = P.accept.some(x => norm(x) === norm(a));
      print(ok ? "Correcto." : "No es eso.", ok ? "" : "dim");
      await attempt(ok, a, a);
      return;
    }
    const r = P.fs[c];
    print(r != null ? r : "comando no encontrado: " + c.split(" ")[0], r == null ? "dim" : "");
  });
  t.addEventListener("click", () => { if (!inp.disabled) inp.focus(); });
  return {reveal(){ inp.disabled = true; print("sesión cerrada", "dim"); }};
}

const PEEK_MAX = 2;
const peeksLeft = () => Math.max(0, PEEK_MAX - (today.peeks || 0));
function peekMsg(){ const l = peeksLeft(); return l > 1 ? "Puedes releer la pregunta " + l + " veces tocando la caja." : l === 1 ? "Puedes releer la pregunta una vez más." : "Ya no puedes releer la pregunta."; }
let peekTok = 0, peekBusy = false;
function toBox(ps){
  const r = scene.getBoundingClientRect(), t = ps.getBoundingClientRect();
  return "translate(" + ((r.left + r.width / 2) - (t.left + t.width / 2)).toFixed(1) + "px," + ((r.top + r.height / 2) - (t.top + t.height / 2)).toFixed(1) + "px) scale(" + (r.width / t.width).toFixed(4) + ")";
}
const boxTf = ps => { const k = scene.getBoundingClientRect().width / ps.getBoundingClientRect().width; return cubeEl.style.transform.replace(/translateY\(([-\d.]+)px\)/, (m, v) => "translateY(" + (parseFloat(v) / k).toFixed(2) + "px)"); };
async function openPeek(){
  if (peekBusy || $("peek").classList.contains("vis")) return;
  if (!peeksLeft()){ rattle(false); sayEl.textContent = peekMsg(); return; }
  today.peeks = (today.peeks || 0) + 1; save();
  $("pkLeft").textContent = peeksLeft() ? "Te queda una lectura" : "Última lectura";
  peekBusy = true;
  const pk = $("peek"), ps = $("pkScene"), pc = ps.firstElementChild, q = $("pQ"), tok = ++peekTok;
  q.textContent = "";
  freezeCube = true;
  ps.style.transition = pc.style.transition = "none";
  ps.style.transform = "none";
  pk.classList.add("vis");
  pc.style.transform = boxTf(ps);
  ps.style.transform = toBox(ps);
  box.style.transition = "none"; box.style.opacity = "0";
  await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
  ps.style.transition = pc.style.transition = "";
  pk.classList.add("open");
  ps.style.transform = "none";
  pc.style.transform = "translateY(0px) rotateX(-6deg) rotateY(-9deg)";
  await sleep(RM ? 0 : 950);
  peekBusy = false;
  for (const ch of P.q){ if (tok !== peekTok) return; q.textContent += ch; if (!RM) await sleep(ch === " " ? 5 : 11); }
}
async function closePeek(){
  const pk = $("peek"), ps = $("pkScene"), pc = ps.firstElementChild, q = $("pQ");
  if (!pk.classList.contains("open") || peekBusy) return;
  peekBusy = true; ++peekTok;
  const txt = q.textContent;
  if (!RM) for (let i = txt.length; i >= 0; i -= 6){ q.textContent = txt.slice(0, i); await sleep(8); }
  pk.classList.remove("open");
  pc.style.transform = boxTf(ps);
  ps.style.transform = toBox(ps);
  await sleep(RM ? 0 : 930);
  box.style.opacity = "";
  pk.classList.remove("vis");
  ps.style.transition = pc.style.transition = "none"; ps.style.transform = "none";
  freezeCube = false;
  await new Promise(res => requestAnimationFrame(res));
  box.style.transition = "";
  peekBusy = false;
  if (today.status === "playing") sayEl.textContent = peekMsg();
}
scene.addEventListener("click", () => { if (scene.classList.contains("closed") && !drag.moved && !busy && today.status === "playing") openPeek(); });
box.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && scene.classList.contains("closed") && today.status === "playing"){ e.preventDefault(); openPeek(); } });

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(window._toast); window._toast = setTimeout(() => t.classList.remove("on"), 1800); }
$("share").addEventListener("click", async () => {

$("replay").hidden = !TEST;
if (TEST){

}

function history(){
  let days = data.days;
  if (TEST && Object.keys(days).filter(k => days[k].status === "won" || days[k].status === "lost").length < 3){
    days = {}; const n = new Date();
    for (let i = 1; i < 30; i++){ const d = new Date(n.getFullYear(), n.getMonth(), n.getDate() - i), r = Math.random();

}
